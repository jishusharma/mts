<title>CBP Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--surface-2:#efeee9;--border:#ddd9d0;--text:#1c1b19;--dim:#6f6a60;--accent:#2f6f5e;
--good:#1f7a4d;--good-s:#e3f1e8;--warn:#96650a;--warn-s:#fbf0dc;--bad:#a4302a;--bad-s:#f7e6e4;--info:#1d5c86;--info-s:#e3edf4;
--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--surface:#191d24;--surface-2:#1f242c;--border:#2c313b;--text:#e7e6e2;--dim:#8b9099;--accent:#5fb39c;
--good:#4fbd82;--good-s:#1a2b21;--warn:#d9a441;--warn-s:#2e2717;--bad:#e2726a;--bad-s:#2e1c1a;--info:#6fb0dc;--info-s:#1b2d3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--surface:#191d24;--surface-2:#1f242c;--border:#2c313b;--text:#e7e6e2;--dim:#8b9099;--accent:#5fb39c;
--good:#4fbd82;--good-s:#1a2b21;--warn:#d9a441;--warn-s:#2e2717;--bad:#e2726a;--bad-s:#2e1c1a;--info:#6fb0dc;--info-s:#1b2d3c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);padding:28px 16px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{font-size:26px;margin:4px 0;letter-spacing:-.01em}
h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.count,.sub{font:12px var(--mono);color:var(--dim);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;gap:3px}
.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:600 18px var(--mono)}
.stat .n{font-size:11.5px;color:var(--dim)}
section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.pill{display:inline-block;font:600 11.5px var(--mono);padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-in{background:var(--bad-s);color:var(--bad)} .p-notin{background:var(--good-s);color:var(--good)}
.p-und{background:var(--warn-s);color:var(--warn)} .p-nd{background:var(--surface-2);color:var(--dim)}
.p-info{background:var(--info-s);color:var(--info)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.d{font:12.5px var(--mono);color:var(--dim);white-space:nowrap}
.verdict{border-left:4px solid var(--warn);background:var(--surface-2);padding:12px 16px;border-radius:0 10px 10px 0}
.tl{display:grid;gap:0}
.ev{display:grid;grid-template-columns:96px 74px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:start}
.ev:last-child{border-bottom:0}
.ev .w{font:12px var(--mono);color:var(--dim)}
.card{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:grid;gap:5px}
.card dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:0;font-size:13px}
.card dt{color:var(--dim)} .card dd{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.alloc{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.alloc div{background:var(--surface-2);border-radius:8px;padding:9px;text-align:center}
.alloc b{display:block;font:600 14px var(--mono)} .alloc span{font-size:11px;color:var(--dim)}
.warnbox{border:1px solid var(--warn);background:var(--warn-s);border-radius:10px;padding:12px 14px}
footer{font-size:12px;color:var(--dim);text-align:center}
.s-ok{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
@media(max-width:560px){h1{font-size:21px}section{padding:14px}.ev{grid-template-columns:1fr}}
</style>

<div class="wrap" id="app"></div>
