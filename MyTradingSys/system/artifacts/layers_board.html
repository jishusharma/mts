<title>MTS Layers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one row per layer on an 8-step road (idea -> testnet); open a row for its road, stuck cards, missing steps and backtests.
   Tokens are the Control Room's (scripts/dev/control_room.tpl.html) so the two pages read as one system. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#16202b; --muted:#5b6672; --line:#d9ddd6;
  --accent:#1d5c86; --accent-soft:#e3edf4;
  --ok:#23794a; --ok-soft:#e2f2e8; --warn:#9a6400; --warn-soft:#fbf0d9; --bad:#b3322b; --bad-soft:#f8e2df;
  --later:#c9cec6;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --ink:#e4e9ee; --muted:#93a0ad; --line:#2a3542;
  --accent:#6fb0dc; --accent-soft:#1b2d3c;
  --ok:#5cc58a; --ok-soft:#173226; --warn:#e2b04d; --warn-soft:#352a12; --bad:#ef7b72; --bad-soft:#3a1c1a; --later:#3a4552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --ink:#e4e9ee; --muted:#93a0ad; --line:#2a3542;
  --accent:#6fb0dc; --accent-soft:#1b2d3c;
  --ok:#5cc58a; --ok-soft:#173226; --warn:#e2b04d; --warn-soft:#352a12; --bad:#ef7b72; --bad-soft:#3a1c1a; --later:#3a4552; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;gap:22px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
h4{font-size:.92rem;font-weight:700}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.85em}
.eyebrow{font:600 .72rem/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:grid;gap:10px}
.lede{max-width:78ch;color:var(--muted)}
.totals{display:flex;flex-wrap:wrap;gap:8px}
.tot{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tot b{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.tot.bad b{color:var(--bad)} .tot.warn b{color:var(--warn)} .tot.acc b{color:var(--accent)}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:600 .92rem var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.pane{display:grid;gap:14px;min-width:0}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:8px;border-radius:2px}
/* status colours, one place */
.s-done{background:var(--ok)}
.s-failed{background:var(--bad)}
.s-now{background:var(--accent)}
.s-planned{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.s-missing{background:var(--warn-soft);box-shadow:inset 0 0 0 1.5px var(--warn)}
.s-later{background:var(--later)}
.s-skip{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
/* layer rows */
.layers{display:grid;gap:8px}
details.layer{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
details.layer[open]{border-color:var(--accent)}
details.layer>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 18px;align-items:center}
details.layer>summary::-webkit-details-marker{display:none}
.lname{display:grid;gap:2px;min-width:0}
.lname h3{font-size:1.02rem}
.lname .plain{font-size:.86rem;color:var(--muted)}
.road{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;min-width:0}
.road i{display:block;height:10px;border-radius:2px}
.road-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;font-size:.62rem;color:var(--muted);line-height:1.15;margin-top:4px}
.lmeta{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.chip{font:600 .74rem var(--body);border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.nextline{grid-column:1/-1;font-size:.84rem;color:var(--muted);min-width:0}
.nextline b{color:var(--ink);font-weight:600}
.infra{font:600 .7rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* detail */
.detail{border-top:1px solid var(--line);padding:14px;display:grid;gap:16px}
.status{max-width:90ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px 150px minmax(0,1fr);gap:4px 12px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);font:600 .78rem var(--mono);color:var(--muted);padding-top:2px}
.steps .lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.steps .lab i{flex:none;width:12px;height:12px;border-radius:3px}
.steps .body{display:grid;gap:3px;font-size:.88rem;min-width:0}
.cardref{font-size:.82rem;color:var(--muted)}
.cardref code{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{display:grid;gap:8px;align-content:start;min-width:0}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.88rem}
.empty{font-size:.86rem;color:var(--muted)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font:600 .72rem var(--body);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill.blocked{background:var(--warn-soft);color:var(--warn)} .pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.raw,.pill.refined{background:var(--accent-soft);color:var(--accent)} .pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.missing{background:var(--bad-soft);color:var(--bad)} .pill.open{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.how{max-width:100ch}
.how h2,.how h3{margin-top:14px}
.how p,.how ul{margin:6px 0}
.how ul{padding-left:20px}
footer{font-size:.8rem;color:var(--muted)}
@media (max-width:820px){
  details.layer>summary{grid-template-columns:minmax(0,1fr)}
  .lmeta{justify-content:flex-start}
  .steps li{grid-template-columns:24px minmax(0,1fr)}
  .steps .body{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){details.layer{transition:border-color .15s}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="meta">MyTradingSys</div>
    <h1>MTS Layers</h1>
    <p class="lede">Every layer walks the same road: idea, inputs in BTC data, fees fit, seen on charts, built, DEV test, out-of-sample check, testnet.
      <strong>Stuck</strong> means a card that has not moved. <strong>Missing</strong> means a step nobody has planned. Open a layer to see its road, its cards and its backtests.</p>
    <div class="totals" id="totals"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-layers" aria-controls="layers" aria-selected="true">Layers</button>
    <button class="tab" role="tab" id="tab-waiting" aria-controls="waiting" aria-selected="false">Waiting on you</button>
    <button class="tab" role="tab" id="tab-how" aria-controls="how" aria-selected="false">How MTS runs</button>
  </div>

  <section class="pane" id="layers" role="tabpanel" aria-labelledby="tab-layers">
    <div class="legend" id="legend"></div>
    <div class="layers" id="layerlist"></div>
  </section>

  <section class="pane" id="waiting" role="tabpanel" aria-labelledby="tab-waiting" hidden></section>
  <section class="pane how" id="how" role="tabpanel" aria-labelledby="tab-how" hidden></section>

  <footer id="foot"></footer>
</div>

    : `<div class="infra">infrastructure: no road</div>`;
  const chips = [];
  if (f.steps.length) chips.push(`<span class="chip">${f.progress[0]} of ${f.progress[1]} steps</span>`);
  if (f.stuck.length) chips.push(`<span class="chip warn">${f.stuck.length} stuck</span>`);
  if (f.held.length) chips.push(`<span class="chip">${f.held.length} on hold</span>`);
  if (f.missing.length) chips.push(`<span class="chip bad">${f.missing.length} missing</span>`);
  chips.push(`<span class="chip">moved ${f.moved_days === null ? "never" : days(f.moved_days) + (f.moved_days ? " ago" : "")}</span>`);
  const nxt = f.next ? `Next: <b>${esc(f.next.title)}</b> <span class="mono">(${esc(f.next.id)}, ${esc(f.next.state)})</span>` : `Next: <b>nothing planned</b>`;
  const steps = f.steps.map(s => `<li><div class="lab"><i class="s-${s.s}"></i>${esc(s.label)}</div>
      <div class="body"><span><span class="pill ${s.s === "missing" ? "missing" : ""}">${esc(s.s)}</span> ${esc(s.note)}</span>${s.cards.map(cardRef).join("")}</div></li>`).join("");
  const stuck = f.stuck.length ? `<ul>${f.stuck.map(x => `<li><code>${esc(x.card)}</code>: ${esc(x.why)}</li>`).join("")}</ul>` : `<p class="empty">Nothing stuck.</p>`;
  const miss = f.missing.length ? `<ul>${f.missing.map(x => `<li><b>${esc(x.step)}</b>: ${esc(x.note)}</li>`).join("")}</ul>` : `<p class="empty">No missing step.</p>`;
  const live = f.open.filter(c => c.state !== "blocked");
  const open = live.length ? `<div class="tw"><table><thead><tr><th>Card</th><th>What</th><th>State</th><th>Lane</th><th>Prio</th><th>Unchanged</th></tr></thead><tbody>${
      live.map(c => `<tr><td><code>${esc(c.id)}</code></td><td>${esc(c.title)}</td><td><span class="pill ${esc(c.state)}">${esc(c.state)}</span></td><td>${esc(c.lane)}</td><td class="n">${esc(c.prio)}</td><td class="n">${days(c.age)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="empty">No open card.</p>`;
  const bts = f.backtests.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Run</th><th>Verdict</th></tr></thead><tbody>${
      f.backtests.map(b => `<tr><td class="n">${esc(b.date)}</td><td><code>${esc(b.id)}</code></td><td>${esc(b.verdict)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No backtest row.</p>`;
  const files = Object.entries(f.files).filter(([, v]) => v.length).map(([k, v]) => `<div class="cardref">${k}: ${v.map(p => `<code>${esc(p)}</code>`).join(" · ")}</div>`).join("");
  return `<details class="layer" id="L-${esc(f.id)}"><summary>
      <div class="lname"><h3>${esc(f.name)}</h3><span class="plain">${esc(f.plain)}</span></div>${road}<div class="lmeta">${chips.join("")}</div>
      <div class="nextline">${nxt}</div></summary>
    <div class="detail">
      <p class="status"><span class="eyebrow">Status</span><br>${esc(f.status)}</p>
      ${f.steps.length ? `<div class="box"><h4>Road</h4><ol class="steps">${steps}</ol></div>` : ""}
      <div class="cols"><div class="box"><h4>Stuck</h4>${stuck}</div><div class="box"><h4>Missing</h4>${miss}</div></div>
      ${f.held.length ? `<details class="box"><summary><b>On hold (${f.held.length})</b>: parked on purpose, open to see why</summary><ul>${f.held.map(c => `<li><code>${esc(c.id)}</code>: ${esc((c.why[0] || "").replace(/^on hold \d+ d: /, ""))}</li>`).join("")}</ul></details>` : ""}
      <div class="box"><h4>Open cards (${live.length} open, ${f.held.length} on hold, ${f.done_count} done)</h4>${open}</div>
      <div class="box"><h4>Backtests</h4>${bts}</div>
      ${files ? `<div class="box"><h4>Files</h4>${files}</div>` : ""}
    </div></details>`;
}
document.getElementById("layerlist").innerHTML = DATA.families.map(layerRow).join("");

function waiting() {
  const dec = DATA.decisions;
  const open = dec.filter(d => d.state === "open"), unapplied = dec.filter(d => d.state !== "open");
  const dtab = rows => `<div class="tw"><table><thead><tr><th>Id</th><th>Question</th><th>Recommended</th><th>Open</th></tr></thead><tbody>${
      rows.map(d => `<tr><td><code>${esc(d.id)}</code>${d.no_auto ? ` <span class="pill open">needs you</span>` : ""}</td><td>${esc(d.question)}${d.answer ? `<div class="cardref">Answer: ${esc(d.answer)}</div>` : ""}</td><td>${esc(d.recommended)}</td><td class="n">${days(d.days)}</td></tr>`).join("")}</tbody></table></div>`;
  const held = DATA.held.length ? `<ul>${DATA.held.map(c => `<li><code>${esc(c.id)}</code> (${days(c.age)}): ${esc((c.why[0] || "").replace(/^on hold \d+ d: /, ""))}</li>`).join("")}</ul>` : `<p class="empty">No card on hold.</p>`;
  const cl = DATA.stale_claims.length ? `<ul>${DATA.stale_claims.map(c => `<li><code>${esc(c.task)}</code> held by ${esc(c.host)} / ${esc(c.account)} for ${c.age_h} h</li>`).join("")}</ul>` : `<p class="empty">No claim older than 24 h.</p>`;
  const loose = DATA.loose.length ? `<details><summary>${DATA.loose.length} open cards belong to no layer (process, tooling, live system)</summary><ul>${DATA.loose.map(c => `<li><code>${esc(c.id)}</code> <span class="pill ${esc(c.state)}">${esc(c.state)}</span> ${esc(c.title)}</li>`).join("")}</ul></details>` : "";
  return `<div class="panel"><h2>Questions for you</h2><p class="muted">Answer on the Control Room page, or tell Claude in chat. Rows marked "needs you" never apply by themselves.</p>${open.length ? dtab(open) : `<p class="empty">No open question.</p>`}</div>
    ${unapplied.length ? `<div class="panel"><h2>Answered, not applied yet</h2>${dtab(unapplied)}</div>` : ""}
    <div class="cols"><div class="panel"><h2>On hold</h2>${held}</div><div class="panel"><h2>Old claims</h2>${cl}</div></div>
    <div class="panel"><h2>All cards</h2><p class="num">${Object.entries(DATA.counts).map(([k, v]) => `${k} ${v}`).join(" · ")}</p>${loose}</div>`;
}
document.getElementById("waiting").innerHTML = waiting();
document.getElementById("tab-waiting").textContent = `Waiting on you (${DATA.totals.waiting})`;
document.getElementById("how").innerHTML = DATA.how || `<p class="empty">HOW_MTS_RUNS.md not found.</p>`;
document.getElementById("foot").innerHTML = `Built by <code>scripts/dev/make_layers_board.py</code> from layer_index.json, task cards, git history, claims and OPERATOR_DECISIONS.md. Nobody edits this page by hand: change the files, rebuild, republish.`;

const tabs = [...document.querySelectorAll(".tab")];
function show(id) {
  tabs.forEach(t => { const on = t.getAttribute("aria-controls") === id; t.setAttribute("aria-selected", on); document.getElementById(t.getAttribute("aria-controls")).hidden = !on; });
  try { localStorage.setItem("mts-layers-tab", id); } catch (e) {}
}
tabs.forEach(t => t.addEventListener("click", () => show(t.getAttribute("aria-controls"))));
const h = location.hash.replace("#", "");
let start = ["layers", "waiting", "how"].includes(h) ? h : null;
if (!start) { try { start = localStorage.getItem("mts-layers-tab"); } catch (e) {} }
show(["layers", "waiting", "how"].includes(start) ? start : "layers");
</script>
