<title>MTS Research Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a research desk notebook. Sticky tab bar; each tab is one question the operator asks
   (where are we, what was tested, what runs now, where each trader stands, what data and rules, what can I change). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#14202b; --muted:#566371; --line:#d6dde4;
  --accent:#2f43c4; --accent-soft:#e7eafb;
  --pass:#17734a; --pass-soft:#e2f3ea; --fail:#b42318; --fail-soft:#fbe7e5; --warn:#9a5700; --warn-soft:#fbf0dd;
  --info:#28627f; --info-soft:#e2eff5; --ours:#6e3fb8; --ours-soft:#efe7fb; --src:#17734a; --src-soft:#e2f3ea;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161d24; --sunk:#121820; --ink:#e4e9ee; --muted:#9aa6b2; --line:#29323c;
  --accent:#93a2ff; --accent-soft:#232a4d;
  --pass:#5fcf95; --pass-soft:#16301f; --fail:#ff8a7d; --fail-soft:#3a1a17; --warn:#f2b54f; --warn-soft:#382a12;
  --info:#7cc0e0; --info-soft:#15303d; --ours:#c3a3ff; --ours-soft:#2c2142; --src:#5fcf95; --src-soft:#16301f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161d24; --sunk:#121820; --ink:#e4e9ee; --muted:#9aa6b2; --line:#29323c;
  --accent:#93a2ff; --accent-soft:#232a4d;
  --pass:#5fcf95; --pass-soft:#16301f; --fail:#ff8a7d; --fail-soft:#3a1a17; --warn:#f2b54f; --warn-soft:#382a12;
  --info:#7cc0e0; --info-soft:#15303d; --ours:#c3a3ff; --ours-soft:#2c2142; --src:#5fcf95; --src-soft:#16301f;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:750}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.84em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.stamp{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{font:600 .9rem var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--surface)}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tabs button:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.tab{display:grid;gap:22px;padding-top:22px}
.lede{max-width:72ch;color:var(--ink);font-size:1.06rem}
.sub{color:var(--muted);max-width:72ch}
.eyebrow{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.block{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;border-top:3px solid var(--tone,var(--line))}
.tile .v{font:800 1.7rem var(--f-display);font-stretch:85%}
.tile .s{color:var(--muted);font-size:.9rem}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.t-pass{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.t-fail{background:var(--fail-soft);color:var(--fail);border-color:transparent}
.t-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.t-ours{background:var(--ours-soft);color:var(--ours);border-color:transparent}
.t-src{background:var(--src-soft);color:var(--src);border-color:transparent}
.t-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ladder */
.ladder{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ladder table{border-collapse:collapse;width:100%;min-width:760px}
.ladder th,.ladder td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:.86rem}
.ladder th{font:700 .72rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.ladder th small{display:block;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);opacity:.85}
.ladder td.l{text-align:left;font-weight:700;white-space:nowrap;padding-left:14px}
.ladder td.l span{display:block;font-weight:400;color:var(--muted);font-size:.8rem;white-space:normal;max-width:220px}
.cell{height:14px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.cell.done{background:color-mix(in srgb,var(--accent) 70%,var(--surface));border-color:transparent}
.cell.now{background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell.stop{background:var(--fail-soft);border-color:var(--fail)}

/* QA */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.qa .panel{display:grid;gap:6px}
.qa .q{font:700 1rem var(--f-display);font-stretch:92%}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .lbl{font-size:.8rem;color:var(--muted);margin-right:4px}

/* test cards */
.list{display:grid;gap:12px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--tone,var(--line))}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:6px}
details.card>summary::-webkit-details-marker{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card .title{font:750 1.05rem var(--f-display);font-stretch:90%}
.card .meta{font-size:.84rem;color:var(--muted)}
.card .plain{max-width:90ch}
.more{font-size:.8rem;color:var(--accent);font-weight:600}
details[open] .more{display:none}
.body{padding:0 16px 16px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fact{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.fact .k{font:700 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:700 .7rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.tbl tr:last-child td{border-bottom:none}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.nums div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid}
.nums b{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.nums span{font-size:.74rem;color:var(--muted)}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}
.files{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);word-break:break-all}

.origin{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.origin div{position:relative;padding:0 0 10px 16px}
.origin div::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.origin b{font-weight:700}
.origin .w{font:600 .74rem var(--f-mono);color:var(--muted);margin-right:6px}
.origin .src{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.why{background:var(--warn-soft);border-radius:8px;padding:10px 12px}
/* running */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start}
.run .who{font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;font-size:.93rem}
.kv dt{color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;min-width:0}

/* data timeline */
.timeline{position:relative;height:auto;display:grid;gap:8px}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:.86rem}
.tl-bar{position:relative;height:22px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tl-seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:700 .66rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);white-space:nowrap;overflow:hidden}
.tl-axis{display:grid;grid-template-columns:150px 1fr;gap:10px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tl-axis div:last-child{position:relative;height:14px}
.tl-axis span{position:absolute;transform:translateX(-50%)}

/* levers */
.say{font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:6px 8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.say button{font:600 .72rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;padding:2px 7px;cursor:pointer;flex:none}
.foot{color:var(--muted);font-size:.86rem;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
@media (max-width:560px){ .kv{grid-template-columns:1fr} .tl-row,.tl-axis{grid-template-columns:90px 1fr} .tile .v{font-size:1.45rem} }
@media (prefers-reduced-motion:no-preference){ section.tab{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }
</style>

const TABS = [
  ["overview","Overview"],["tested","What was tested"],["now","Running now"],
  ["layers","Traders & gates"],["data","Data & rules"],["levers","What you can change"]
];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tone = v => {
  const u = String(v||"").toUpperCase();
  if (/^(PASS|KEEP|SOUND|LIVE|DONE|UP|MATCH)/.test(u)) return "pass";
  if (/^(FAIL|NO.?EDGE|DROP|STOP|HALT|DOWN|BLOCK)/.test(u)) return "fail";
  if (/^(INCONCLUSIVE|FIX|PARTIAL|WAIT|HELD|MIXED|OFFLINE|SHADOW)/.test(u)) return "warn";
  if (/^(RUNNING|QUEUED|PLANNED|NEXT|READY|IN PROGRESS)/.test(u)) return "info";
  return "";
};
const pill = (txt, t) => `<span class="pill ${t ? "t-"+t : (tone(txt) ? "t-"+tone(txt) : "")}">${esc(txt)}</span>`;
const toneVar = t => ({pass:"var(--pass)",fail:"var(--fail)",warn:"var(--warn)",info:"var(--info)",acc:"var(--accent)"}[t] || "var(--line)");
const label = l => l ? pill(l, /OURS/i.test(l) ? "ours" : /SOURCED/i.test(l) ? "src" : "") : "";

function overview(){
  const D = DATA.overview;
  const tiles = D.tiles.map(t => `<div class="tile" style="--tone:${toneVar(t.tone)}"><span class="eyebrow">${esc(t.label)}</span><span class="v">${esc(t.value)}</span><span class="s">${esc(t.sub)}</span></div>`).join("");
  const gates = DATA.gates;
  const head = gates.map(g => `<th>${esc(g.id)}<small>${esc(g.name)}</small></th>`).join("");
  const rows = DATA.layers.map(l => {
    const at = gates.findIndex(g => g.id === l.gate);
    const cells = gates.map((g,i) => {
      let c = "cell";
      if (l.stopped && i === at) c += " stop"; else if (i < at) c += " done"; else if (i === at) c += " now";
      return `<td title="${esc(g.id+' '+g.name)}"><div class="${c}"></div></td>`;
    }).join("");
    return `<tr><td class="l">${esc(l.name)}<span>${esc(l.short)}</span></td>${cells}</tr>`;
  }).join("");
  const qa = D.answers.map(a => `<div class="panel"><span class="q">${esc(a.q)}</span><p>${a.a}</p></div>`).join("");
  return `
  <div class="block"><span class="eyebrow">Where we are</span><p class="lede">${D.headline}</p></div>
  <div class="tiles">${tiles}</div>
  <div class="block"><h2>Every trader on one ladder</h2>
    <p class="sub">A trader's idea moves right only when the gate before it is proven with a file. Filled = passed, ringed = working on it now, red = stopped at that gate. Nothing reaches testnet without passing every column.</p>
    <div class="ladder"><table><thead><tr><th style="text-align:left;padding-left:14px">Trader / idea</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="block"><h2>Straight answers</h2><div class="qa">${qa}</div></div>`;
}

let fV = "All", fL = "All";
function tested(){
  const T = DATA.tests;
  const verdicts = ["All", ...new Set(T.map(t => t.verdictGroup))];
  const layers = ["All", ...new Set(T.map(t => t.layer))];
  const fb = (arr, cur, kind) => arr.map(v => `<button data-f="${kind}" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(v)}</button>`).join("");
  const shown = T.filter(t => (fV==="All"||t.verdictGroup===fV) && (fL==="All"||t.layer===fL));
  const cards = shown.map(t => {
    const tn = tone(t.verdict) || "acc";
    const params = (t.params||[]).length ? `<div class="tbl"><table><thead><tr><th>Setting</th><th>Value</th><th>Whose</th><th>Note</th></tr></thead><tbody>${t.params.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${esc(p.value)}</td><td>${label(p.label)}</td><td>${esc(p.note||"")}</td></tr>`).join("")}</tbody></table></div>` : "";
    const nums = (t.numbers||[]).length ? `<div class="nums">${t.numbers.map(n => `<div><b>${esc(n[1])}</b><span>${esc(n[0])}</span></div>`).join("")}</div>` : "";
    const levers = (t.levers||[]).length ? `<div><div class="eyebrow" style="margin-bottom:4px">You could change</div><ul class="clean">${t.levers.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    const why = t.why ? `<div class="why">${t.why}</div>` : "";
    const origin = (t.origin||[]).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Where the idea came from</div><div class="origin">${t.origin.map(o => `<div><span class="w">${esc(o.when)}</span><b>${esc(o.who)}</b>: ${esc(o.what)}<span class="src">${esc(o.src)}</span></div>`).join("")}</div></div>` : "";
    const used = u => pill(u === "yes" ? "In" : u === "no" ? "Not in" : "Partly", u === "yes" ? "pass" : u === "no" ? "fail" : "warn");
    const ingr = (t.ingredients||[]).length ? `<div><div class="eyebrow" style="margin-bottom:4px">Every ingredient: in the test or not</div><div class="tbl"><table><thead><tr><th>Group</th><th>Ingredient</th><th>In test?</th><th>How, or why not</th></tr></thead><tbody>${t.ingredients.map(i => `<tr><td>${esc(i.group)}</td><td>${esc(i.name)}</td><td>${used(i.used)}</td><td>${esc(i.how)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
    return `<details class="card" style="--tone:${toneVar(tn)}"><summary>
      <div class="row">${pill(t.verdict)}<span class="title">${esc(t.name)}</span></div>
      <div class="meta">${esc(t.layer)} · ${esc(t.date)} · ${esc(t.dataShort)}</div>
      <p class="plain">${esc(t.plain)}</p><span class="more">Show settings, data and numbers ▾</span></summary>
      <div class="body">
        <div class="facts">
          <div class="fact"><div class="k">How it trades</div>${esc(t.trades)}</div>
          <div class="fact"><div class="k">Confluence / filters</div>${esc(t.confluence)}</div>
          <div class="fact"><div class="k">Data</div>${esc(t.data)}</div>
          <div class="fact"><div class="k">Costs assumed</div>${esc(t.costs)}</div>
        </div>
        ${nums}${why}${origin}${ingr}${params}${levers}
        <div class="files">${(t.files||[]).map(esc).join("<br>")}</div>
      </div></details>`;
  }).join("") || `<div class="panel">No test matches these filters.</div>`;
  const planned = DATA.planned.map(p => `<li><b>${esc(p.name)}</b> - ${esc(p.what)} ${p.state ? pill(p.state) : ""}</li>`).join("");
  return `
  <div class="block"><h2>What was tested, and what came out</h2>
  <p class="sub">${DATA.testsIntro}</p></div>
  <div class="filters"><span class="lbl">Verdict</span>${fb(verdicts,fV,"v")}</div>
  <div class="filters"><span class="lbl">Trader / idea</span>${fb(layers,fL,"l")}</div>
  <div class="list">${cards}</div>
  <div class="block panel"><h3>Planned, not tested yet</h3><ul class="clean">${planned}</ul></div>`;
}

function now(){
  const groups = DATA.running;
  return `<div class="block"><h2>Running now, and why</h2><p class="sub">${DATA.runningIntro}</p></div>` +
    groups.map(g => `<div class="block"><span class="eyebrow">${esc(g.group)}</span><div class="grid2">${g.items.map(r => `
      <div class="run"><div class="row">${pill(r.state)}<h3>${esc(r.name)}</h3></div>
      <dl class="kv"><dt>Does</dt><dd>${esc(r.does)}</dd><dt>Solves</dt><dd>${esc(r.why)}</dd><dt>Output</dt><dd>${esc(r.output)}</dd>${r.when?`<dt>When</dt><dd>${esc(r.when)}</dd>`:""}</dl></div>`).join("")}</div></div>`).join("");
}

function layers(){
  return `<div class="block"><h2>Each trader: idea, gate, next step</h2><p class="sub">${DATA.layersIntro}</p></div>
  <div class="grid2">${DATA.layers.map(l => `<div class="run">
    <div class="row">${pill(l.gate + " " + (DATA.gates.find(g=>g.id===l.gate)||{}).name, l.stopped ? "fail" : "acc")}<h3>${esc(l.name)}</h3></div>
    <p>${esc(l.idea)}</p>
    <dl class="kv"><dt>Setups</dt><dd>${esc(l.setups)}</dd><dt>Tested</dt><dd>${esc(l.tested)}</dd><dt>Now</dt><dd>${esc(l.now)}</dd><dt>Next</dt><dd>${esc(l.next)}</dd>${l.blockers?`<dt>Blocked by</dt><dd>${esc(l.blockers)}</dd>`:""}</dl></div>`).join("")}</div>
  <div class="block"><h3>The gates</h3><div class="tbl"><table><thead><tr><th>Gate</th><th>Name</th><th>Done when</th></tr></thead><tbody>${DATA.gates.map(g=>`<tr><td class="num">${esc(g.id)}</td><td>${esc(g.name)}</td><td>${esc(g.done)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function dataTab(){
  const tl = DATA.timeline, a = Date.parse(tl.from), b = Date.parse(tl.to);
  const pos = d => ((Date.parse(d)-a)/(b-a)*100);
  const rows = tl.rows.map(r => `<div class="tl-row"><span>${esc(r.name)}</span><div class="tl-bar">${r.segs.map(s => `<div class="tl-seg" title="${esc(s.label+': '+s.from+' to '+s.to)}" style="left:${pos(s.from)}%;width:${pos(s.to)-pos(s.from)}%;background:${toneVar(s.tone)}">${esc(s.label)}</div>`).join("")}</div></div>`).join("");
  const axis = tl.ticks.map(t => `<span style="left:${pos(t+'-01-01')}%">${t}</span>`).join("");
  return `<div class="block"><h2>The data, and the rules every test follows</h2><p class="sub">${DATA.dataIntro}</p></div>
  <div class="panel timeline">${rows}<div class="tl-axis"><div></div><div>${axis}</div></div></div>
  <div class="block"><h3>Data sets</h3><div class="tbl"><table><thead><tr><th>Data</th><th>Covers</th><th>Where</th><th>Used for / gaps</th></tr></thead><tbody>${DATA.datasets.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td class="num">${esc(d.covers)}</td><td>${esc(d.where)}</td><td>${esc(d.note)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="block"><h3>Rules every test follows</h3><div class="qa">${DATA.rules.map(r=>`<div class="panel"><span class="q">${esc(r.name)}</span><p>${esc(r.text)}</p></div>`).join("")}</div></div>`;
}

function levers(){
  const L = DATA.levers;
  return `<div class="block"><h2>What you can change</h2><p class="sub">${L.intro}</p></div>
  ${L.groups.map(g => `<div class="block"><h3>${esc(g.name)}</h3><div class="tbl"><table><thead><tr><th>Setting</th><th>Now</th><th>Whose</th><th>What changing it does</th></tr></thead><tbody>${g.items.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td class="num">${esc(i.now)}</td><td>${label(i.label)}</td><td>${esc(i.effect)}${i.say?`<div class="say" style="margin-top:6px"><span>${esc(i.say)}</span><button type="button" data-copy="${esc(i.say)}">Copy</button></div>`:""}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}
  <div class="block panel"><h3>Decisions waiting for you</h3><ul class="clean">${L.decisions.map(d=>`<li><b>${esc(d.q)}</b> ${esc(d.detail)} ${d.def?`<span class="sub">Default if you say nothing: ${esc(d.def)}</span>`:""}</li>`).join("")}</ul></div>`;
}

const RENDER = {overview, tested, now, layers, data: dataTab, levers};
let cur = "overview";
function show(id){
  if (!RENDER[id]) id = "overview";
  cur = id;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === id));
  document.getElementById("main").innerHTML = `<section class="tab" id="sec-${id}">${RENDER[id]()}</section>
   <div class="foot">${DATA.footer}</div>`;
  try { localStorage.setItem("mts-map-tab", id); } catch(e) {}
}
document.getElementById("stamp").textContent = "updated " + DATA.updated;
document.getElementById("tabs").innerHTML = TABS.map(([id,n]) => `<button role="tab" data-t="${id}">${n}</button>`).join("");
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { show(b.dataset.t); if (location.hash !== "#"+b.dataset.t) history.replaceState(null,"","#"+b.dataset.t); window.scrollTo({top:0}); } });
document.getElementById("main").addEventListener("click", e => {
  const f = e.target.closest("button[data-f]");
  if (f) { if (f.dataset.f === "v") fV = f.dataset.v; else fL = f.dataset.v; show("tested"); return; }
  const c = e.target.closest("button[data-copy]");
  if (c) { const t = c.dataset.copy; navigator.clipboard?.writeText(t).then(() => { c.textContent = "Copied"; }, () => { c.textContent = "Select"; }); }
});
let start = (location.hash || "").slice(1);
if (!RENDER[start]) { try { start = localStorage.getItem("mts-map-tab") || "overview"; } catch(e) { start = "overview"; } }
show(start);
</script>
