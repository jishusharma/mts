<title>MTS Research Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a research desk notebook. Sticky tab bar; each tab is one question the operator asks
   (where are we, what was tested, what runs now, where each trader stands, what data and rules, what can I change).
   v10: spacious reading layout (17px base, 1.6 line height), structured real examples, bottom action bar per test card. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#14202b; --muted:#566371; --line:#d6dde4;
  --accent:#2f43c4; --accent-soft:#e7eafb;
  --pass:#17734a; --pass-soft:#e2f3ea; --fail:#b42318; --fail-soft:#fbe7e5; --warn:#9a5700; --warn-soft:#fbf0dd;
  --info:#28627f; --info-soft:#e2eff5; --ours:#6e3fb8; --ours-soft:#efe7fb; --src:#17734a; --src-soft:#e2f3ea;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:12px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161d24; --sunk:#121820; --ink:#e4e9ee; --muted:#9aa6b2; --line:#29323c;
  --accent:#93a2ff; --accent-soft:#232a4d; --on-accent:#0e1318;
  --pass:#5fcf95; --pass-soft:#16301f; --fail:#ff8a7d; --fail-soft:#3a1a17; --warn:#f2b54f; --warn-soft:#382a12;
  --info:#7cc0e0; --info-soft:#15303d; --ours:#c3a3ff; --ours-soft:#2c2142; --src:#5fcf95; --src-soft:#16301f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161d24; --sunk:#121820; --ink:#e4e9ee; --muted:#9aa6b2; --line:#29323c;
  --accent:#93a2ff; --accent-soft:#232a4d; --on-accent:#0e1318;
  --pass:#5fcf95; --pass-soft:#16301f; --fail:#ff8a7d; --fail-soft:#3a1a17; --warn:#f2b54f; --warn-soft:#382a12;
  --info:#7cc0e0; --info-soft:#15303d; --ours:#c3a3ff; --ours-soft:#2c2142; --src:#5fcf95; --src-soft:#16301f;
  color-scheme:dark }
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.6 var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:88%;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.55rem;font-weight:750}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1.02rem;font-weight:700;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.84em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
code,.why,.fact,.pendlist li{overflow-wrap:anywhere}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;gap:8px;padding-block:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:1.35rem;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.stamp{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;min-width:0}
.tabs button{font:600 .95rem var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--surface)}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tabs button:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;margin-left:6px;min-width:1.4em;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 .72rem/1.6 var(--f-body);text-align:center}

/* edit-mode switch (header) */
.sw{font:600 .85rem var(--f-body);min-height:44px;display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.sw .swtxt{display:grid;line-height:1.2}
.sw .swtxt small{font-weight:400;font-size:.74rem;color:var(--muted)}
.sw .knob{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sw[aria-pressed="true"] .swtxt small{color:var(--accent)}
.sw[aria-pressed="true"] .knob{background:var(--accent)}
.sw[aria-pressed="true"] .knob::after{transform:translateX(16px)}

/* page rhythm */
section.tab{display:grid;gap:32px;padding-top:28px}
section.tab,.block,.body,.list,.run,.req{grid-template-columns:minmax(0,1fr)}
.tab>*,.body>*,.block>*{min-width:0}
.block{display:grid;gap:14px}
.lede{max-width:65ch;color:var(--ink);font-size:1.15rem;line-height:1.6}
.sub{color:var(--muted);max-width:65ch}
.eyebrow{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.block p,.panel p,.body p{max-width:65ch}
ul.bul{margin:0;padding-left:1.15em;display:grid;gap:10px;max-width:65ch}
ul.bul li::marker{color:var(--accent)}
ul.clean{margin:0;padding-left:1.15em;display:grid;gap:10px;max-width:65ch}
.tip{background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:14px 18px;max-width:65ch;font-size:.95rem}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:12px 16px;font-size:.95rem;max-width:65ch}
.banner.bad{background:var(--fail-soft);border-color:var(--fail)}
.banner.edit{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:6px;align-content:start;border-top:4px solid var(--tone,var(--line))}
.tile .v{font:800 2rem var(--f-display);font-stretch:85%;line-height:1.1}
.tile .s{color:var(--muted);font-size:.95rem;line-height:1.5}
.tile details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;padding-top:4px;list-style:none}
.tile details summary::-webkit-details-marker{display:none}
.tile details p{color:var(--muted);font-size:.92rem;margin-top:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .74rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.t-pass{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.t-fail{background:var(--fail-soft);color:var(--fail);border-color:transparent}
.t-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-info{background:var(--info-soft);color:var(--info);border-color:transparent}
.t-ours{background:var(--ours-soft);color:var(--ours);border-color:transparent}
.t-src{background:var(--src-soft);color:var(--src);border-color:transparent}
.t-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ladder */
.ladder{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ladder table{border-collapse:collapse;width:100%;min-width:760px}
.ladder th,.ladder td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:.9rem}
.ladder th{font:700 .72rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.ladder th small{display:block;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);opacity:.85}
.ladder td.l{text-align:left;font-weight:700;white-space:nowrap;padding-left:16px}
.ladder td.l span{display:block;font-weight:400;color:var(--muted);font-size:.82rem;white-space:normal;max-width:240px}
.cell{height:14px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.cell.done{background:color-mix(in srgb,var(--accent) 70%,var(--surface));border-color:transparent}
.cell.now{background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell.stop{background:var(--fail-soft);border-color:var(--fail)}
.ladder-m{display:none;gap:14px}
.lm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}
.lm .lmn{font:700 1.05rem var(--f-display)}
.lm .lms{color:var(--muted);font-size:.92rem}
.lm .bar{display:flex;gap:4px}
.lm .bar .cell{flex:1}

/* answers accordion */
.acc{display:grid;gap:12px}
details.qa-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.qa-item>summary{list-style:none;cursor:pointer;padding:18px 22px;font:700 1.08rem var(--f-display);font-stretch:92%;display:flex;justify-content:space-between;gap:14px;align-items:center;min-height:56px}
details.qa-item>summary::-webkit-details-marker{display:none}
details.qa-item>summary::after,details.card>summary::after,details.sec2>summary::after{content:"+";font:600 1.4rem/1 var(--f-body);color:var(--accent);flex:none}
details[open].qa-item>summary::after,details[open].card>summary::after,details[open].sec2>summary::after{content:"\2212"}
details.qa-item .qa-body{padding:0 22px 22px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.qa-body ul.bul{gap:12px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 15px;min-height:42px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .lbl{font-size:.82rem;color:var(--muted);margin-right:4px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;min-width:5.5em}
.filters select{font:600 .95rem var(--f-body);min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:6px 12px;max-width:100%}
.count{color:var(--muted);font-size:.9rem}
.filterbox{display:grid;gap:12px}

/* test cards */
.list{display:grid;gap:18px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-left:6px solid var(--tone,var(--line))}
details.card>summary{list-style:none;cursor:pointer;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start;min-height:56px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{grid-column:2;grid-row:1}
.s-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;grid-column:1}
.card .title{font:750 1.2rem var(--f-display);font-stretch:90%;line-height:1.25;grid-column:1}
.card .means{grid-column:1/-1;font-size:1.04rem;max-width:65ch;line-height:1.55}
.card .meta{font-size:.86rem;color:var(--muted)}
.card .more{grid-column:1/-1;font-size:.86rem;color:var(--accent);font-weight:600}
details[open] .more{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.body{padding:6px 22px 24px;display:grid;gap:32px;border-top:1px solid var(--line);padding-top:26px}
.sec{display:grid;gap:12px}
.sec>h4{display:flex;align-items:center;gap:10px}
.sec>h4::before{content:"";width:4px;height:1.1em;border-radius:2px;background:var(--accent);flex:none}
.why{background:var(--warn-soft);border-radius:10px;padding:14px 18px;max-width:65ch;font-size:1rem;line-height:1.6}
.why .eyebrow{display:block;margin-bottom:4px;color:var(--warn)}
details.sec2{border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
details.sec2>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:50px}
details.sec2>summary::-webkit-details-marker{display:none}
details.sec2>.in{padding:0 18px 18px;display:grid;gap:12px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.stat .sv2{font:700 1.45rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .sv2.long{font-size:1.05rem;line-height:1.3}
.stat .sk{font-size:.9rem;color:var(--muted);line-height:1.35}
.stat .ss{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}

/* real example */
.example{background:var(--sunk);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:22px;display:grid;gap:20px}
.example.ex-math{border-left-color:var(--warn)}
.ex-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.ex-head h4{font-size:1.08rem}
.ex-when{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.ex-setup{font-size:1.08rem;line-height:1.55;max-width:60ch}
.ex-note{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:-10px}
.steps{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.steps li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:4px 18px;padding:15px 18px;border-bottom:1px solid var(--line);align-items:baseline}
.steps li:last-child{border-bottom:0}
.steps .sl{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.steps .sv{font-family:var(--f-mono);font-size:.92rem;line-height:1.5;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ex-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rbox{border-radius:12px;padding:18px 20px;border:1px solid var(--line);display:grid;gap:6px;align-content:start;background:var(--surface);min-width:0}
.rbox .rt{font:700 .74rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rbox .rbig{font:700 1.3rem/1.25 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rbox .rsm{font-size:.98rem;line-height:1.5}
.rbox.good{background:var(--pass-soft);border-color:color-mix(in srgb,var(--pass) 40%,transparent)}
.rbox.good .rbig{color:var(--pass)}
.rbox.bad{background:var(--fail-soft);border-color:color-mix(in srgb,var(--fail) 40%,transparent)}
.rbox.bad .rbig{color:var(--fail)}
.rbox.neu{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.rbox.neu .rbig{color:var(--warn)}
.ex-key{font-size:.92rem;color:var(--muted);max-width:60ch}
.ex-src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.5}
details.orig summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;min-height:36px;display:flex;align-items:center}
details.orig p{margin-top:8px;font-size:.95rem;color:var(--muted);line-height:1.6;max-width:65ch;overflow-wrap:anywhere}

/* definition lists */
.defs{display:grid;gap:0;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.defs>div{display:grid;grid-template-columns:11em minmax(0,1fr);gap:4px 20px;padding:14px 18px;border-bottom:1px solid var(--line)}
.defs>div:last-child{border-bottom:0}
.defs dt{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:.3em}
.defs dd{margin:0;min-width:0;line-height:1.55;overflow-wrap:anywhere}

/* tables (stack into cards on phones) */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;line-height:1.5}
.tbl th{font:700 .72rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.tbl tr:last-child td{border-bottom:none}
.edit{width:100%;min-width:11ch;min-height:44px;font:inherit;font-family:var(--f-mono);font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;resize:vertical}
.chg{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-family:var(--f-mono);font-size:.86rem}
.chg s{color:var(--muted)}
.pendlist{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.pendlist li{line-height:1.55}
.files{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);word-break:break-all;line-height:1.7}
.origin{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.origin div{position:relative;padding:0 0 14px 18px;line-height:1.55}
.origin div::before{content:"";position:absolute;left:-7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.origin .w{font:600 .76rem var(--f-mono);color:var(--muted);margin-right:6px}
.origin .src{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* action bar */
.abar{display:flex;flex-wrap:wrap;gap:12px;padding-top:22px;border-top:1px solid var(--line)}
.abar .btn{flex:1 1 180px}
.btn{font:600 .95rem var(--f-body);min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* running / layers */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:14px;align-content:start}
.run h3{font-size:1.12rem}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:10px 16px;font-size:1rem;margin:0;line-height:1.55}
.kv dt{color:var(--muted);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:.35em}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* data timeline */
.timeline{position:relative;height:auto;display:grid;gap:12px}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:.9rem}
.tl-bar{position:relative;height:24px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tl-seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:700 .66rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);white-space:nowrap;overflow:hidden}
.tl-axis{display:grid;grid-template-columns:150px 1fr;gap:12px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tl-axis div:last-child{position:relative;height:14px}
.tl-axis span{position:absolute;transform:translateX(-50%)}

/* levers */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.qa .panel{display:grid;gap:8px;align-content:start}
.qa .q{font:700 1.05rem var(--f-display);font-stretch:92%}
.say{font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-top:8px}
.say button{font:600 .82rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:8px;padding:6px 14px;min-height:40px;cursor:pointer;flex:none}
.foot{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:20px;margin-top:40px;display:grid;gap:8px;max-width:75ch}

/* floating note button and popover */
.notebtn{position:absolute;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.pop{position:absolute;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:var(--r);padding:20px;display:grid;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.pop label{display:grid;gap:6px;font:700 .8rem var(--f-body);color:var(--muted);letter-spacing:.03em}
.pop input,.pop select,.pop textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.pop .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pop .popwhere{font:700 .85rem var(--f-body);color:var(--muted)}
blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--sunk);color:var(--ink);font-size:.95rem;line-height:1.55;overflow-wrap:anywhere;border-radius:0 8px 8px 0}
.err{color:var(--fail);background:var(--fail-soft);border-radius:8px;padding:10px 14px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font:600 .92rem var(--f-body);max-width:calc(100vw - 32px);text-align:center}

/* requests inbox */
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.rgroup{display:grid;gap:14px}
.rgroup>h3{display:flex;align-items:center;gap:10px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:16px;line-height:1.6;border-left:6px solid var(--tone,var(--line))}
.req.st-new,.req.st-seen{--tone:var(--info)}
.req.st-done{--tone:var(--pass)}
.req.st-declined{--tone:var(--fail)}
.req .reqwhere{font:700 1.02rem var(--f-display)}
.req .ask{display:grid;gap:8px}
.req .ask p{max-width:65ch;font-size:1.04rem}
.req .reqparam{font-family:var(--f-mono);font-size:.92rem}
.req .reply{background:var(--pass-soft);border-radius:10px;padding:14px 18px;display:grid;gap:6px}
.req.st-declined .reply{background:var(--fail-soft)}
.req .reply p{font-size:1.04rem}
.req .waiting{color:var(--muted);font-size:.95rem;border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.copybox{display:grid;gap:6px;margin-top:10px}
.copybox textarea{width:100%;font:.8rem var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.reqsum{display:flex;flex-wrap:wrap;gap:10px}

@media (prefers-reduced-motion:no-preference){ section.tab{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }

@media (max-width:640px){

  details.qa-item .qa-body{padding:16px 18px 20px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:14px}
  .stat .sv2{font-size:1.2rem}
  .filters .lbl{width:100%}
  .abar .btn{flex:1 1 100%}
  .top .wrap{padding-block:8px}
  .stamp{display:none}
  .brand h1{font-size:1.15rem}
  .sw{padding-right:12px}
  /* tables become cards */
  .stack{border:0;background:none;overflow:visible}
  .stack table,.stack tbody,.stack tr,.stack td{display:block;width:100%}
  .stack thead{display:none}
  .stack tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}

  .pop{position:fixed!important;left:12px!important;right:12px!important;top:auto!important;bottom:12px!important;width:auto!important;max-height:85vh;overflow:auto}
}
@media (max-width:420px){
  .steps li{grid-template-columns:minmax(0,1fr)}
}

/* ---------- prose helpers: long text becomes short sentences / bullets ---------- */
const SENT_RE = /(?<=[.!?])\s+(?=[A-Z<"(])/;
function balanceTags(parts){
  const re = /<(\/?)(b|i|code|s)>/g;
  let carry = [];
  return parts.map(p => {
    const stack = carry.slice(); let m;
    re.lastIndex = 0;
    while ((m = re.exec(p))) {
      if (!m[1]) stack.push(m[2]);
      else { const i = stack.lastIndexOf(m[2]); if (i >= 0) stack.splice(i, 1); }
    }
    const opens = carry.map(t => `<${t}>`).join("");
    const closes = stack.slice().reverse().map(t => `</${t}>`).join("");
    carry = stack;
    return opens + p + closes;
  });
}
function sentences(html){
  const parts = String(html || "").split(SENT_RE).map(x => x.trim()).filter(Boolean);
  return parts.length > 1 ? balanceTags(parts) : parts;
}
function prose(html){
  const s = sentences(html);
  if (!s.length) return "";
  if (s.length <= 2) return `<p>${s.join(" ")}</p>`;
  return `<p>${s[0]}</p><ul class="bul">${s.slice(1).map(x => `<li>${x}</li>`).join("")}</ul>`;
}
const stripTags = h => String(h || "").replace(/<[^>]+>/g, "");
function oneLine(text){
  const t = stripTags(text), s = t.split(SENT_RE).map(x => x.trim()).filter(Boolean);
  if (!s.length) return "";
  let out = s[0];
  if (out.length < 45 && s[1]) out += " " + s[1];
  return out;
}

/* ---------- requests store (shared db, or this browser as fallback) ---------- */
let recMode = lsGet("mts-map-record") === "1";
let REQS = [];                 // all requests, newest first (module-level; UI re-renders from here)
let baseReqs = [];             // what the store last told us
const inflight = new Map();    // writes not yet echoed back by the store
let dbh = null, uid = null, storeMode = "pending", dbErr = "";
const uiErr = {};              // inline errors by key (test id, "levers", "requests")
const OPEN = new Set();        // test cards the viewer has open
const OPEN_STATES = ["new","seen"];

function recompute(){
  const m = new Map(baseReqs.map(r => [r.id, r]));
  inflight.forEach((r,id) => { if (!m.has(id)) m.set(id, r); });
  REQS = [...m.values()].sort((a,b) => String(b.at||"").localeCompare(String(a.at||"")));
}
function loadLocal(){
  try { const a = JSON.parse(lsGet("mts-map-requests") || "[]"); return Array.isArray(a) ? a : []; } catch(e) { return []; }
}
function saveLocal(){ return lsSet("mts-map-requests", JSON.stringify(baseReqs)); }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const ready = (async () => {
  const C = window.claude;
  if (!C || typeof C.use !== "function") { storeMode = "local"; baseReqs = loadLocal(); recompute(); return; }
  try { const u = await C.use("user"); if (u && u.id) uid = await u.id(); } catch(e) {}
  try { dbh = await C.use("db"); } catch(e) { dbh = null; }
  if (!dbh) { storeMode = "local"; baseReqs = loadLocal(); recompute(); refresh(); return; }
  storeMode = "db";
  try {
    dbh.collection("requests").onSnapshot(snap => {
      baseReqs = snap.docs.map(d => Object.assign({id: d.id}, d.data() || {}));
      baseReqs.forEach(r => inflight.delete(r.id));
      dbErr = ""; recompute(); refresh();
    }, err => { dbErr = "Could not read shared requests: " + ((err && err.message) || "unknown error"); refresh(); });
  } catch(e) { dbErr = "Could not read shared requests: " + (e && e.message || "error"); }
  refresh();
})();

function errText(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "revoked") return "You do not have permission to save here.";
  if (c === "quota_exceeded" || c === "resource_exhausted") return "The shared store is full. Use Copy for Claude instead.";
  return "Could not save: " + ((e && e.message) || "unknown error");
}
async function saveRequest(f){
  const id = newId();
  const doc = Object.assign({kind:"", quote:"", tab:cur, testId:"", group:"", param:"", from:"", to:"", text:"", status:"new", at:new Date().toISOString()}, f);
  if (uid) doc.by = uid;
  const row = Object.assign({id}, doc);
  inflight.set(id, row); recompute(); refresh();     // optimistic: shows at once
  await ready;
  try {
    if (dbh) { await dbh.collection("requests").doc(id).set(doc); }
    else { inflight.delete(id); baseReqs.push(row); recompute(); if (!saveLocal()) return {ok:true, warn:"Kept for this visit only (browser storage is blocked)."}; }
  } catch(e) {
    inflight.delete(id); recompute(); refresh();
    return {ok:false, err:errText(e)};
  }
  return {ok:true, id};
}
async function deleteRequest(id){
  await ready;
  try {
    if (dbh) { await dbh.collection("requests").doc(id).delete(); }
    baseReqs = baseReqs.filter(r => r.id !== id); inflight.delete(id); recompute();
    if (!dbh) saveLocal();
    return null;
  } catch(e) { return errText(e); }
}

/* ---------- copy with fallback ---------- */
function copyText(text, btn){
  const done = m => { if (btn) { const o = btn.dataset.lbl || btn.textContent; btn.dataset.lbl = o; btn.textContent = m; setTimeout(() => { btn.textContent = o; }, 1800); } };
  const fallback = () => {
    let box = document.getElementById("copybox");
    if (!box) { box = document.createElement("div"); box.id = "copybox"; box.className = "copybox"; box.innerHTML = `<div class="eyebrow">Select all and copy</div><textarea readonly rows="6"></textarea>`; (btn && btn.closest(".block, td, .say") || document.getElementById("main")).appendChild(box); }
    const ta = box.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    done(ok ? "Copied" : "Select + copy");
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => done("Copied"), fallback); return; } } catch(e) {}
  fallback();
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000);
}

/* ---------- selection -> "Note / ask" ---------- */
const MAIN = document.getElementById("main");
const noteBtn = document.getElementById("notebtn");
let noteCtx = null, selT = 0, pop = null;

function ctxFrom(el, quote){
  const card = el && el.closest ? el.closest("[data-id]") : null;
  const row = el && el.closest ? el.closest("tr[data-lever]") : null;
  return {
    quote: quote ? (quote.length > 300 ? quote.slice(0, 299) + "…" : quote) : "",
    tab: cur,
    testId: card ? card.dataset.id : "",
    group: row ? row.dataset.groupName : "",
    param: row ? row.dataset.lever : ""
  };
}
function readSel(){
  const s = window.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return null;
  const txt = s.toString().replace(/\s+/g, " ").trim();
  if (txt.length < 2) return null;
  const r = s.getRangeAt(0);
  const a = r.commonAncestorContainer, el = a.nodeType === 1 ? a : a.parentElement;
  if (!el || !MAIN.contains(el) || el.closest("textarea,input,.pop")) return null;
  return {txt, r, el};
}
function place(node, rect, w){
  const m = window.innerWidth < 600 ? 16 : 12, sx = window.scrollX, sy = window.scrollY;
  const vw = document.documentElement.clientWidth;
  const left = Math.max(sx + m, Math.min(rect.left + sx, sx + vw - w - m));
  node.style.left = left + "px";
  node.style.top = (rect.bottom + sy + 8) + "px";
}
function hideNoteBtn(){ noteBtn.hidden = true; noteCtx = null; }
function checkSel(){
  if (pop) return;
  const i = readSel();
  if (!i) { hideNoteBtn(); return; }
  const rs = i.r.getClientRects(); const last = rs.length ? rs[rs.length - 1] : i.r.getBoundingClientRect();
  noteCtx = ctxFrom(i.el, i.txt);
  noteBtn.hidden = false;
  place(noteBtn, last, noteBtn.offsetWidth || 110);
  const bt = noteBtn.getBoundingClientRect();
  if (bt.bottom > window.innerHeight && last.top - bt.height - 8 > 0) noteBtn.style.top = (last.top + window.scrollY - bt.height - 8) + "px";
}
const queueSel = ms => { clearTimeout(selT); selT = setTimeout(checkSel, ms); };
document.addEventListener("selectionchange", () => queueSel(300));
MAIN.addEventListener("mouseup", () => queueSel(10));
MAIN.addEventListener("touchend", () => queueSel(350), {passive:true});
noteBtn.addEventListener("pointerdown", e => e.preventDefault());   // keep the selection
noteBtn.addEventListener("mousedown", e => e.preventDefault());
noteBtn.addEventListener("click", () => {
  if (!noteCtx) return;
  const c = noteCtx, rect = noteBtn.getBoundingClientRect();
  hideNoteBtn();
  openPop(c, rect, c.param ? "change" : "question");
});

/* ---------- popover form ---------- */
function closePop(){ if (pop) { pop.remove(); pop = null; } }
function openPop(c, anchor, kind){
  closePop();
  const p = document.createElement("form");
  p.className = "pop"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Add a note");
  const where = c.testId ? testName(c.testId) : (c.group ? "Settings: " + c.group : "");
  p.innerHTML = `
    ${where ? `<div class="popwhere">${esc(where)}</div>` : ""}
    ${c.quote ? `<blockquote>${esc(c.quote)}</blockquote>` : ""}
    <label>What is this?
      <select name="kind"><option value="question">Question</option><option value="change">Change a setting / condition</option><option value="rerun">Re-run this test</option></select></label>
    <div class="chfields" hidden>
      <label>Setting<input name="param" type="text" value="${esc(c.param)}"></label>
      <div class="two"><label>Change from<input name="from" type="text" autocomplete="off"></label><label>To<input name="to" type="text" autocomplete="off"></label></div>
    </div>
    <label><span class="notelbl">Your note</span><textarea name="text" rows="3" placeholder="Write it in your own words"></textarea></label>
    <div class="err" role="alert" hidden></div>
    <div class="actions"><button type="submit" class="btn primary">Save</button><button type="button" class="btn" data-cancel="1">Cancel</button></div>`;
  document.body.appendChild(p);
  pop = p;
  const sel = p.elements.kind, ch = p.querySelector(".chfields");
  sel.value = kind || "question";
  const ta = p.elements.text;
  const sync = () => {
    ch.hidden = sel.value !== "change";
    ta.placeholder = sel.value === "rerun" ? "Optional: anything to change in this re-run?" : "Write it in your own words";
    p.querySelector(".notelbl").textContent = sel.value === "rerun" ? "Your note (optional)" : "Your note";
  };
  sel.addEventListener("change", sync); sync();
  const w = Math.min(400, document.documentElement.clientWidth - 32);
  p.style.width = w + "px";
  place(p, anchor, w);
  p.addEventListener("submit", async e => {
    e.preventDefault();
    const f = p.elements, k = f.kind.value;
    let text = f.text.value.trim();
    const er = p.querySelector(".err");
    const fail = m => { er.textContent = m; er.hidden = false; };
    if (k === "change" && !f.to.value.trim() && !text) return fail("Say what it should change to, or write a note.");
    if (k === "question" && !text && !c.quote) return fail("Write a note first.");
    if (k === "rerun" && !text) { const L = c.testId ? pendingLines(c.testId) : []; text = L.length ? L.join("; ") : "Re-run as is, no setting changes pending."; }
    const btn = p.querySelector('button[type="submit"]'); btn.disabled = true;
    const res = await saveRequest({kind:k, quote:c.quote, tab:c.tab, testId:c.testId, group:c.group,
      param: k === "change" ? f.param.value.trim() : "", from: k === "change" ? f.from.value.trim() : "", to: k === "change" ? f.to.value.trim() : "", text});
    if (!res.ok) { btn.disabled = false; return fail(res.err); }
    closePop(); window.getSelection().removeAllRanges();
    toast(res.warn || "Saved. It is in Your requests.");
  });
  p.addEventListener("click", e => { if (e.target.closest("[data-cancel]")) closePop(); });
  p.scrollIntoView({block:"nearest"});
  try { p.elements.text.focus({preventScroll:true}); } catch(e) {}
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); hideNoteBtn(); } });

/* ---------- edit-settings switch ---------- */
const recBtn = document.getElementById("rec"), recState = document.getElementById("recState");
function syncRec(){
  recBtn.setAttribute("aria-pressed", String(recMode));
  recState.textContent = recMode ? "On: edit any value" : "Off: reading only";
}
function setRec(on){
  recMode = on; lsSet("mts-map-record", on ? "1" : "0"); syncRec();
  const y = window.scrollY; show(cur); window.scrollTo(0, y);
}
recBtn.addEventListener("click", () => setRec(!recMode));
syncRec();

/* ---------- events ---------- */
document.getElementById("stamp").textContent = "updated " + DATA.updated;
document.getElementById("tabs").innerHTML = TABS.map(([id,n]) => `<button role="tab" data-t="${id}">${n}</button>`).join("");
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { show(b.dataset.t); if (location.hash !== "#"+b.dataset.t) history.replaceState(null,"","#"+b.dataset.t); window.scrollTo({top:0}); } });
MAIN.addEventListener("toggle", e => { const d = e.target; if (d && d.matches && d.matches("details.card")) { if (d.open) OPEN.add(d.dataset.id); else OPEN.delete(d.dataset.id); } }, true);
MAIN.addEventListener("click", async e => {
  const f = e.target.closest("button[data-f]");
  if (f) { if (f.dataset.f === "v") fV = f.dataset.v; else fL = f.dataset.v; show("tested"); return; }
  const c = e.target.closest("button[data-copy]");
  if (c) { copyText(c.dataset.copy, c); return; }
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "addnote" || act === "ask") { openPop({quote:"", tab:cur, testId:b.dataset.id, group:"", param:""}, b.getBoundingClientRect(), "question"); return; }
  if (act === "chg") {
    const id = b.dataset.id;
    OPEN.add(id);
    if (!recMode) setRec(true);
    const card = MAIN.querySelector(`details.card[data-id="${CSS.escape(id)}"]`);
    const ta = card && card.querySelector("textarea.edit");
    if (ta) { ta.scrollIntoView({block:"center"}); ta.focus(); toast("Edit a value, then tap outside the box to save it as a request."); }
    else { const bb = card ? card.querySelector('[data-act="chg"]') : b; openPop({quote:"", tab:cur, testId:id, group:"", param:""}, bb.getBoundingClientRect(), "change"); }
    return;
  }
  if (act === "copyall") { copyText(REQS.map(reqLine).join("\n"), b); return; }
  if (act === "delreq") { const m = await deleteRequest(b.dataset.rid); uiErr.requests = m || ""; refresh(); return; }
  if (act === "rerun") {
    const id = b.dataset.id, lines = pendingLines(id);
    if (!lines.length) { openPop({quote:"", tab:cur, testId:id, group:"", param:""}, b.getBoundingClientRect(), "rerun"); return; }
    b.disabled = true;
    const res = await saveRequest({kind:"rerun", testId:id, tab:cur, text: lines.join("; ")});
    b.disabled = false;
    uiErr[id] = res.ok ? "" : res.err; refresh();
    if (res.ok) toast(res.warn || "Re-run requested. Claude runs it in the next super session.");
  }
});
MAIN.addEventListener("change", async e => {
  const sl = e.target.closest("select[data-fsel]");
  if (sl) { fL = sl.value; show("tested"); return; }
  const t = e.target.closest("textarea.edit");
  if (!t) return;
  const val = t.value.trim(), orig = t.dataset.orig;
  const p = pendingParam(t.dataset.test, t.dataset.group, t.dataset.param);
  const shown = p ? p.to : orig;
  if (val === shown || !val) { t.value = shown; return; }
  const key = t.dataset.test || "levers";
  const res = await saveRequest({kind:"param", testId:t.dataset.test, group:t.dataset.group, param:t.dataset.param, from:shown, to:val, tab:cur, text:""});
  uiErr[key] = res.ok ? "" : res.err; refresh();
});
MAIN.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && e.target.matches && e.target.matches("textarea.edit")) { e.preventDefault(); e.target.blur(); } });

let start = (location.hash || "").slice(1);
if (!RENDER[start]) { start = lsGet("mts-map-tab") || "overview"; }
show(start);
ready.then(() => { refresh(); });
</script>
