<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Live Aid Map</title>
<style>
:root { --bg: #0d1013; --panel: #141920; --line: #232b35; --fg: #e3e8ee; --dim: #8592a1; --up: #3fbf8a; --down: #e2665c; --amber: #e0a43a; --accent: #6ea8d9; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 12px 12px 40px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 18px; } h3 { margin: 0 0 6px; font-size: 16px; }
.tag, .dim { color: var(--dim); } .tag { font-size: 12px; margin: 0; }
.up { color: var(--up); } .down { color: var(--down); }
.pbg { display: grid; gap: 12px; }
.pbc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.pbc.now { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.pbh { font: 12px ui-monospace, Consolas, monospace; color: var(--dim); }
.pbst { font: 700 11px system-ui, sans-serif; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--dim); color: var(--dim); }
.pbst.NOW { background: var(--amber); border-color: var(--amber); color: var(--bg); }
.pbs, .pbn, .pba ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; } .pbn { font-size: 13px; color: var(--dim); gap: 4px; }
.pbs li { font-size: 14px; } .pbr { font-size: 14px; } .pbl { font-size: 13px; line-height: 1.7; }
.pbmsg { margin: 0; padding: 8px 10px; border: 1px solid var(--amber); border-radius: 6px; } .pbmsg.stale { color: var(--amber); }
.pby table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; } .pby th, .pby td { text-align: left; padding: 3px 4px; border-top: 1px solid var(--line); }
@media (max-width: 400px) { body { font-size: 15px; } main { padding: 8px 8px 32px; } .pby table { font-size: 12px; } }
</style></head>
<body><main>
  <div id="pb"></div>
  <details><summary class="dim">Detail</summary><div id="pbd"></div></details>
</main>
<script>
// Level registry for the whole Live Aid page (card live-aid-bias-map-one-screen-1109). Every section that names a price level
// (playbook key levels, analyst calls, MA strip averages, Levels panel) hands it over here; a level that two sections name
// within MERGE (0.15 %) is ONE zone with merged source badges, so no tab shows the same level twice. Pure functions, no DOM,
// no new statistic: a zone is only the sorted, merged list of prices the sections already computed. Descriptive only.
(function (root) {
  'use strict';
  var MERGE = 0.0015;                       // 0.15 %: the operator's merge distance (OURS, card 11-09)
  var NEAR_N = 3;                           // zones kept above and below price on the ladder
  // playbook key (daily_playbook.py NAMES) -> [one-word label, badge]; badge = what the operator reads on the band
  var KEYS = { PDH: ['High', 'PDH'], PDL: ['Low', 'PDL'], PDC: ['Close', 'PDC'], PWH: ['High', 'PWH'], PWL: ['Low', 'PWL'], DAY_OPEN: ['Open', 'DO'], WEEK_OPEN: ['Open', 'WO'],
               VAL: ['Value', 'VAL'], POC: ['Value', 'POC'], VAH: ['Value', 'VAH'] };
  var RANK = { playbook: 0, panel: 1, ma: 2, analyst: 3 };   // which label wins in a merge; analysts speak last

  function num(x) { var v = typeof x === 'number' ? x : parseFloat(x); return isFinite(v) && v > 0 ? v : null; }
  function initials(name) {
    var w = String(name || '').split(/[^A-Za-z0-9]+/).filter(Boolean);
    if (!w.length) return '?';
    return (w.length === 1 ? w[0].slice(0, 2) : w.map(function (x) { return x[0]; }).join('').slice(0, 3)).toUpperCase();
  }
  // items: [{price, src ('playbook'|'panel'|'ma'|'analyst'), label, badge, bias?}] -> items with a valid price only
  function fromPlaybook(levels) {
    return (levels || []).map(function (l) {
      var k = KEYS[l.k] || [String(l.name || l.k || 'Level').split(' ')[0], String(l.k || '').slice(0, 4)], p = num(l.price);
      return p ? { price: p, src: 'playbook', label: k[0], badge: k[1] } : null;
    }).filter(Boolean);
  }
  function fromAnalysts(list) {
    return (list || []).map(function (a) {
      var p = num(a.level);
      return p ? { price: p, src: 'analyst', label: 'Analyst', badge: initials(a.analyst), bias: a.bias || '' } : null;
    }).filter(Boolean);
  }
  function fromPanel(list) {          // [{n, p}] from the Levels panel (day VWAP, day high/low, previous day, weekly open)
    return (list || []).map(function (l) {
      var p = num(l.p), n = String(l.n || '').replace(/ \(typed\)$/, '');
      var b = /vwap/i.test(n) ? 'VWAP' : /day high/i.test(n) ? 'DH' : /day low/i.test(n) ? 'DL' : /prev day high/i.test(n) ? 'PDH' : /prev day low/i.test(n) ? 'PDL' : /weekly open/i.test(n) ? 'WO' : n.slice(0, 4).toUpperCase();
      var lab = /vwap/i.test(n) ? 'VWAP' : /high/i.test(n) ? 'High' : /low/i.test(n) ? 'Low' : /open/i.test(n) ? 'Open' : 'Level';
      return p ? { price: p, src: 'panel', label: lab, badge: b } : null;
    }).filter(Boolean);
  }
  function fromMA(rows) {             // MASTRIP.rows(): {tf, avgs: {ema200: {v}, sma200: {v}, ...}}; only the 200s and 55 EMA of 4h, 1d, 1w (the ones traders draw)
    var out = [];
    (rows || []).forEach(function (r) {
      if (!r || !r.avgs || ['4h', '1d', '1w'].indexOf(r.tf) < 0) return;
      [['ema200', 'E200'], ['sma200', 'S200'], ['ema55', 'E55']].forEach(function (a) {
        var v = r.avgs[a[0]] && num(r.avgs[a[0]].v);
        if (v) out.push({ price: v, src: 'ma', label: 'MA', badge: r.tf.toUpperCase() + a[1] });
      });
    });
    return out;
  }
  // Merge: sorted by price, a level within MERGE of the zone's lowest price joins it (chain-free: one zone never spans more than 0.15 %).
  function merge(items, tol) {
    tol = tol == null ? MERGE : tol;
    var s = (items || []).filter(function (x) { return x && num(x.price); }).slice().sort(function (a, b) { return a.price - b.price; }), out = [];
    s.forEach(function (it) {
      var z = out[out.length - 1];
      if (z && it.price / z.lo - 1 <= tol) { z.hi = it.price; z.items.push(it); } else out.push({ lo: it.price, hi: it.price, items: [it] });
    });
    return out.map(function (z) {
      var badges = [], srcs = [], best = z.items[0];
      z.items.forEach(function (it) {
        if (badges.indexOf(it.badge) < 0) badges.push(it.badge);
        if (srcs.indexOf(it.src) < 0) srcs.push(it.src);
        if (RANK[it.src] < RANK[best.src]) best = it;
      });
      var kinds = z.items.map(function (i) { return i.label; }).filter(function (l, i, a) { return a.indexOf(l) === i; });
      return { lo: z.lo, hi: z.hi, price: Math.round((z.lo + z.hi) / 2 * 10) / 10, label: kinds.length > 1 ? 'Cluster' : best.label, badges: badges, srcs: srcs, n: z.items.length, items: z.items };
    });
  }
  // Ladder around px: the NEAR_N nearest zones above and the NEAR_N nearest below (a zone holding px counts as 'at').
  function ladder(zones, px, n) {
    n = n || NEAR_N;
    var up = [], dn = [], at = null;
    (zones || []).forEach(function (z) {
      if (px >= z.lo && px <= z.hi) at = z; else if (z.lo > px) up.push(z); else dn.push(z);
    });
    up.sort(function (a, b) { return a.lo - b.lo; }); dn.sort(function (a, b) { return b.hi - a.hi; });
    return { above: up.slice(0, n), below: dn.slice(0, n), at: at };
  }
  function build(src, px) { return ladder(merge([].concat(fromPlaybook(src.playbook), fromPanel(src.panel), fromMA(src.ma), fromAnalysts(src.analysts))), px); }
  // The same headline or event never twice: first one wins, key = lower-cased text without spaces and punctuation (events: id).
  function key(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ''); }
  function dedupe(list, keyFn) {
    var seen = {}, f = keyFn || function (x) { return x && typeof x === 'object' ? (x.id || x.title || x.headline || x.text) : x; };
    return (list || []).filter(function (x) { var k = key(f(x)); if (!k || seen[k]) return false; seen[k] = 1; return true; });
  }
  var api = { MERGE: MERGE, NEAR_N: NEAR_N, KEYS: KEYS, initials: initials, fromPlaybook: fromPlaybook, fromAnalysts: fromAnalysts, fromPanel: fromPanel, fromMA: fromMA, merge: merge, ladder: ladder, build: build, dedupe: dedupe, key: key };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LEVELREG = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
// Live Aid Map (card live-aid-bias-map-one-screen-1109): today's playbook as ONE screen, built only from what the other Live Aid
// sections already show. Top: bias dial (LONG / SHORT / HOLD) with how many sections agree. Middle: price ladder (nearest 3 zones
// each side, levels within 0.15 % merged by level_registry.js). Bottom: session strip (Asia / Europe / US, current one lit, one
// arrow each, next-event countdown) and at most 3 scenario cards. No new statistic, no order, nothing gates. Fail closed:
// no data reads NOT_IN_DATA, a stale day reads STALE. Operator rule 11-09: symbols, colour, graphs; at most 60 words on the screen.
(function (root) {
  'use strict';
  var REG = (typeof module !== 'undefined' && module.exports) ? require('./level_registry.js') : root.LEVELREG;
  var SESSIONS = [['Asia', 0, 8], ['Europe', 7, 13], ['US', 13, 21]];     // UTC hours, as daily_playbook.py SESSIONS
  var SECTIONS = ['Analysts', 'Price vs VWAP', 'RSI 1h', 'RSI 4h', 'Pierce', 'Playbook'];   // the six verdicts the page already shows
  var STALE_MS = 36 * 3600 * 1000, DAY_MS = 86400000, SHOW_BADGES = 2, MAX_SCEN = 3;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function ok(v) { return v === 1 || v === -1 || v === 0; }

  // votes: array of +1 / -1 / 0 / null (null = NOT_IN_DATA), one per section. Same threshold as the verdict board (live_aid_indicators.js lean):
  // 3 sections in data needed; LONG at 2+ bull and bull >= 2 x bear; SHORT mirrored; else HOLD.
  function bias(votes, total) {
    var v = (votes || []).filter(ok), bull = v.filter(function (x) { return x === 1; }).length, bear = v.filter(function (x) { return x === -1; }).length;
    total = total || (votes || []).length || SECTIONS.length;
    var dir = v.length < 3 ? 'HOLD' : bull >= 2 && bull >= 2 * bear ? 'LONG' : bear >= 2 && bear >= 2 * bull ? 'SHORT' : 'HOLD';
    var flat = v.length - bull - bear;
    return { dir: dir, cls: dir === 'LONG' ? 'up' : dir === 'SHORT' ? 'down' : 'dim', bull: bull, bear: bear, flat: flat, n: v.length, total: total,
             agree: dir === 'LONG' ? bull : dir === 'SHORT' ? bear : flat, thin: v.length < 3 };
  }
  // The playbook's own verdict: first map of the session in progress (else the next one): UP +1, DOWN -1, NONE 0; null when no map.
  function sessionNow(data, now) {
    var cs = (data && data.sessions) || [], on = cs.filter(function (c) { return now >= c.start_ms && now < c.end_ms; });
    return on.length ? on : cs.filter(function (c) { return c.start_ms > now; }).slice(0, 1);
  }
  function playbookVote(data, now) {
    var cs = sessionNow(data, now);
    for (var i = 0; i < cs.length; i++) {
      var s = cs[i].scenarios && cs[i].scenarios[0];
      if (s) return s.likely === 'UP' ? 1 : s.likely === 'DOWN' ? -1 : 0;
    }
    return null;
  }
  function arrow(c, now) {
    var s = c.scenarios && c.scenarios[0];
    if (s) return s.likely === 'UP' ? '\u2191' : s.likely === 'DOWN' ? '\u2193' : '\u2192';
    if (now >= c.end_ms && c.today && c.today.o && c.today.c) return c.today.c > c.today.o ? '\u2191' : c.today.c < c.today.o ? '\u2193' : '\u2192';
    return '\u00b7';
  }
  function sessions(data, now) {
    var h = new Date(now).getUTCHours() + new Date(now).getUTCMinutes() / 60, byName = {};
    ((data && data.sessions) || []).forEach(function (c) { byName[c.name] = c; });
    return SESSIONS.map(function (s) {
      var c = byName[s[0]];
      return { name: s[0], h0: s[1], h1: s[2], on: h >= s[1] && h < s[2], done: h >= s[2], arrow: c ? arrow(c, now) : '\u00b7', real: !!c && now >= c.end_ms };
    });
  }
  function scenarios(data, now) {
    var out = [];
    sessionNow(data, now).forEach(function (c) { (c.scenarios || []).forEach(function (s) { out.push(s); }); });
    var seen = {};
    return out.filter(function (s) { var k = s.up + '/' + s.down; if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, MAX_SCEN);
  }
  function nextEvent(data, now) {
    var ev = [];
    ((data && data.sessions) || []).forEach(function (c) { (c.events || []).forEach(function (e) { ev.push(e); }); });
    if (data && data.next_event) ev.push(data.next_event);
    ev = REG.dedupe(ev.filter(function (e) { return e && e.t0 > now; }), function (e) { return e.id; }).sort(function (a, b) { return a.t0 - b.t0; });
    return ev[0] || null;
  }
  function countdown(ms) {
    var m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
    return d ? d + 'd' + h + 'h' : h ? h + 'h' + (m % 60) + 'm' : m + 'm';
  }
  function stale(data, now) {
    var d0 = Date.parse(data.day + 'T00:00:00Z'), b = Date.parse(data.built_utc);
    return !isFinite(d0) || now >= d0 + DAY_MS || !isFinite(b) || now - b > STALE_MS;
  }

  // ---------- drawing ----------
  function dial(b) {
    var cells = '';
    (b.votes || []).forEach(function (v) { cells += '<i class="' + (v === 1 ? 'up' : v === -1 ? 'down' : v === 0 ? 'flat' : 'nid') + '"></i>'; });
    return '<div class="lmd ' + b.cls + '"><b class="lmw">' + b.dir + '</b><span class="lmc">' + (b.thin ? b.n + ' of ' + b.total + ' in data' : b.dir === 'HOLD' ? '\u25b2' + b.bull + ' \u25bc' + b.bear + ' of ' + b.total : b.agree + ' of ' + b.total) +
      '</span><span class="lmv" title="' + esc(SECTIONS.join(' / ')) + '">' + cells + '</span></div>';
  }
  function zoneRow(z, side, px, far) {
    var dist = Math.abs((side === 'above' ? z.lo : z.hi) / px - 1), w = Math.round(30 + 70 * (1 - Math.min(1, far > 0 ? dist / far : 0)));
    var bd = z.badges.slice(0, SHOW_BADGES).map(function (b) { return '<i>' + esc(b) + '</i>'; }).join('') + (z.badges.length > SHOW_BADGES ? '<i>+' + (z.badges.length - SHOW_BADGES) + '</i>' : '');
    return '<div class="lmz ' + side + (z.n > 1 ? ' multi' : '') + '" title="' + esc(z.badges.join(' ')) + '"><span class="lmb" style="width:' + w + '%"></span><span class="lml">' + esc(z.label) + '</span><span class="lmg">' + bd + '</span><span class="lmp">' + n0(z.price) + '</span></div>';
  }
  function ladderHtml(lad, px) {
    if (!(px > 0)) return '<div class="lmz dim">NOT_IN_DATA</div>';
    var all = lad.above.concat(lad.below), far = 0;
    all.forEach(function (z) { far = Math.max(far, Math.abs((z.lo > px ? z.lo : z.hi) / px - 1)); });
    var h = lad.above.slice().reverse().map(function (z) { return zoneRow(z, 'above', px, far); }).join('');
    h += '<div class="lmx"><span class="lmb"></span><b>\u25b6 ' + n0(px) + '</b>' + (lad.at ? '<i>' + esc(lad.at.badges.slice(0, SHOW_BADGES).join(' ')) + '</i>' : '') + '</div>';
    h += lad.below.map(function (z) { return zoneRow(z, 'below', px, far); }).join('');
    return '<div class="lmrows">' + h + '</div>';
  }
  function strip(ss, now, ev) {
    var d = new Date(now), h = d.getUTCHours() + d.getUTCMinutes() / 60, lanes = ss.map(function (s) {
      return '<div class="lms2' + (s.on ? ' on' : s.done ? ' done' : '') + '"><span class="lmq" style="left:' + (s.h0 / 24 * 100).toFixed(2) + '%;width:' + ((s.h1 - s.h0) / 24 * 100).toFixed(2) + '%"><b>' + s.name + '</b> <u class="' + (s.arrow === '\u2191' ? 'up' : s.arrow === '\u2193' ? 'down' : 'dim') + (s.real ? ' real' : '') + '">' + s.arrow + '</u></span></div>';
    }).join('');
    var chip = ev ? '<span class="lmn" title="' + esc(ev.id) + '">' + esc(ev.cls) + ' ' + countdown(ev.t0 - now) + '</span>' : '';
    return '<div class="lmt">' + lanes + '<span class="lmnow" style="left:' + (h / 24 * 100).toFixed(2) + '%"></span></div>' + chip;
  }
  function scenHtml(list) {
    return list.map(function (s) {
      var ic = s.likely === 'UP' ? '\u25b2' : s.likely === 'DOWN' ? '\u25bc' : '\u25c6', c = s.likely === 'UP' ? 'up' : s.likely === 'DOWN' ? 'down' : 'dim';
      var body = s.likely === 'UP' ? n0(s.up) + ' \u2715 ' + n0(s.down) : s.likely === 'DOWN' ? n0(s.down) + ' \u2715 ' + n0(s.up) : n0(s.down) + ' / ' + n0(s.up);
      return '<span class="lmk ' + c + '" data-ledger="' + esc(s.id) + '" title="scenario ledger ' + esc(s.id) + ': ' + esc(s.invalid) + '"><b>' + ic + '</b> ' + body + ' <u>' + esc(s.id) + '</u></span>';
    }).join('');
  }
  // model: {data, now, px, votes (6 numbers or null, in SECTIONS order), panel, ma, analysts} -> html
  function html(m) {
    var data = m.data, now = m.now;
    if (!data || !data.sessions) return '<p class="pbmsg">NOT_IN_DATA</p>';
    var px = m.px > 0 ? m.px : data.price, votes = (m.votes || []).slice(0, SECTIONS.length);
    while (votes.length < SECTIONS.length) votes.push(null);
    votes[5] = playbookVote(data, now);
    var b = bias(votes, SECTIONS.length); b.votes = votes;
    var lad = REG.build({ playbook: data.levels, panel: m.panel, ma: m.ma, analysts: m.analysts || data.analysts }, px);
    var h = stale(data, now) ? '<p class="pbmsg stale">STALE</p>' : '';
    h += '<div class="lm">' + dial(b) + '<div class="lmlad">' + ladderHtml(lad, px) + '</div><div class="lmses">' + strip(sessions(data, now), now, nextEvent(data, now)) + '</div><div class="lmcards">' + scenHtml(scenarios(data, now)) + '</div></div>';
    return h;
  }
  var CSS = '.lm{display:grid;gap:8px}.lm i,.lm u{font-style:normal;text-decoration:none}' +
    '.lmd{display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--dim);border-radius:8px}.lmd.up{border-color:var(--up)}.lmd.down{border-color:var(--down)}' +
    '.lmw{font:700 30px/1 var(--mono,monospace)}.lmd.up .lmw{color:var(--up)}.lmd.down .lmw{color:var(--down)}.lmd.dim .lmw{color:var(--dim)}.lmc{font-size:14px;color:var(--dim)}' +
    '.lmv{margin-left:auto;display:flex;gap:3px}.lmv i{width:14px;height:22px;border-radius:2px;background:var(--line)}.lmv i.up{background:var(--up)}.lmv i.down{background:var(--down)}.lmv i.flat{background:var(--dim)}.lmv i.nid{background:transparent;border:1px dashed var(--dim)}' +
    '.lmrows{display:grid;gap:3px}.lmz,.lmx{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:4px;overflow:hidden;font:600 15px var(--mono,monospace)}' +
    '.lmz .lmb{position:absolute;left:0;top:0;bottom:0;opacity:.28;z-index:0}.lmz.above .lmb{background:var(--down)}.lmz.below .lmb{background:var(--up)}.lmz.multi .lmb{opacity:.5}' +
    '.lmz>*:not(.lmb),.lmx>*:not(.lmb){position:relative;z-index:1}.lmz .lml{min-width:64px}.lmg{display:flex;gap:4px}.lmg i{font:600 11px system-ui,sans-serif;padding:1px 5px;border-radius:3px;border:1px solid var(--dim);color:var(--fg)}.lmp{margin-left:auto}' +
    '.lmx{background:var(--panel);border:1px solid var(--amber);color:var(--amber);height:26px}.lmx i{font-size:11px;color:var(--dim)}' +
    '.lmt{position:relative;display:grid;gap:3px;padding:2px 0}.lms2{position:relative;height:22px;background:var(--panel);border-radius:3px}.lmq{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:3px;background:var(--line);color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden}' +
    '.lms2.on .lmq{background:var(--amber);color:#111}.lms2.on .lmq u{color:#111}.lmq u{font:700 15px system-ui}.lmq u.up{color:var(--up)}.lmq u.down{color:var(--down)}.lmq u.real{opacity:.6}.lmnow{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.8}' +
    '.lmses{display:grid;gap:6px}.lmn{justify-self:start;font:700 13px var(--mono,monospace);padding:2px 10px;border-radius:12px;border:1px solid var(--amber);color:var(--amber)}' +
    '.lmcards{display:flex;flex-wrap:wrap;gap:6px}.lmk{padding:3px 8px;border:1px solid var(--dim);border-radius:6px;font:600 14px var(--mono,monospace);white-space:nowrap}.lmk.up{border-color:var(--up)}.lmk.down{border-color:var(--down)}.lmk u{font:11px system-ui;color:var(--dim)}' +
    '@media(max-width:480px){.lmw{font-size:26px}.lmz,.lmx{font-size:14px}.lmz .lml{min-width:52px}}';
  function injectCss(doc) {

<script>
// Daily session playbook text cards (behind the Detail line of the Map tab; the one-screen picture is map.js). The numbers are computed by daily_playbook.py and
// written to playbook_data.js (window.PLAYBOOK_DATA); this file only shows them. Fail closed: no data reads NOT_IN_DATA, a day
// that has ended or data older than 36 h reads STALE, never a guess. Descriptive only: no orders, no sizing, nothing gates.
(function (root) {
  'use strict';
  var SESSIONS = [['Asia', 0, 8], ['Europe', 7, 13], ['US', 13, 21]];   // UTC hours, same as daily_playbook.py SESSIONS (OURS)
  var STALE_MS = 36 * 3600 * 1000, DAY_MS = 86400000;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function p2(x) { return (x * 100).toFixed(2) + '%'; }
  function nowSessions(ms) {
    var d = new Date(ms), h = d.getUTCHours() + d.getUTCMinutes() / 60;
    return SESSIONS.filter(function (s) { return h >= s[1] && h < s[2]; }).map(function (s) { return s[0]; });
  }
  function gradeClass(g) { return g === 'HIT' ? 'up' : g === 'MISS' ? 'down' : 'dim'; }
  function stale(data, now) {
    var d0 = Date.parse(data.day + 'T00:00:00Z'), b = Date.parse(data.built_utc);
    return !isFinite(d0) || now >= d0 + DAY_MS || !isFinite(b) || now - b > STALE_MS;
  }
  function status(c, now) { return now >= c.end_ms ? 'DONE' : now >= c.start_ms ? 'NOW' : 'NEXT'; }

  function scen(s) {
    var c = s.counts, lean = s.likely === 'NONE' ? 'no lean' : 'lean ' + s.likely;
    return '<li><b>' + esc(s.id) + '</b> ' + esc(s.name) + ': up <b class="up">' + n0(s.up) + '</b> <span class="dim">' + esc(s.up_label) + '</span> / down <b class="down">' + n0(s.down) +
      '</b> <span class="dim">' + esc(s.down_label) + '</span> &middot; ' + lean + '<br><span class="dim">history n ' + c.n + ': up first ' + c.UP + ', down first ' + c.DOWN + ', both ' + c.BOTH + ', neither ' + c.NEITHER +
      '</span><br>Invalid: ' + esc(s.invalid) + '<br><span class="dim">' + esc(s.idea) + '</span></li>';
  }
  function card(c, now, nowNames) {
    var on = nowNames.indexOf(c.name) >= 0, st = status(c, now), b = c.base || {}, t = c.today;
    var h = '<article class="pbc' + (on ? ' now' : '') + '" data-s="' + esc(c.name) + '"><h3>' + esc(c.name) + ' <span class="pbh">' + esc(c.hours) + '</span> <span class="pbst ' + st + '">' + st + '</span></h3>';
    if (b.n) h += '<div class="pbr">range p25 / p50 / p75 ' + p2(b.range_p25) + ' / ' + p2(b.range_p50) + ' / ' + p2(b.range_p75) + ' <span class="dim">n ' + b.n + '</span></div>';
    if (t) h += '<div class="pbr">' + (t.complete ? 'today' : 'so far') + ': H ' + n0(t.h) + ' L ' + n0(t.l) + ' range ' + p2(t.range_pct) + (t.pctile == null ? '' : ' <span class="dim">(' + Math.round(t.pctile * 100) + '% of history at or below)</span>') + '</div>';
    h += c.scenarios.length ? '<ul class="pbs">' + c.scenarios.map(scen).join('') + '</ul>' : '<div class="dim">' + (st === 'DONE' ? 'session over; its maps are in the ledger above' : 'no map: levels too close or too little history') + '</div>';
    if (c.events && c.events.length) h += '<div class="pbr">events: ' + c.events.map(function (e) { return esc(e.cls) + ' ' + esc(e.hhmm) + 'Z'; }).join(', ') + '</div>';
    h += '<ul class="pbn">' + (c.notes || []).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></article>';
    return h;
  }
  function yesterday(y) {
    if (!y || !y.rows || !y.rows.length) return '<div class="pby dim">Yesterday: no playbook rows in the ledger.</div>';
    return '<div class="pby"><b>Yesterday ' + esc(y.day) + '</b>: <span class="up">HIT ' + y.hit + '</span> &middot; <span class="down">MISS ' + y.miss + '</span> &middot; NA ' + y.na + ' &middot; open ' + y.open +
      '<table><thead><tr><th>Id</th><th>Session</th><th>Map</th><th>Lean</th><th>Up / down</th><th>Result</th></tr></thead><tbody>' + y.rows.map(function (r) {
        return '<tr><td>' + esc(r.id) + '</td><td>' + esc(r.session) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.likely) + '</td><td>' + n0(r.up) + ' / ' + n0(r.down) + '</td><td class="' + gradeClass(r.grade) + '"><b>' + esc(r.grade) +
          '</b> <span class="dim">' + esc(r.outcome || '') + (r.touched ? ' ' + esc(r.touched.slice(11, 16)) + 'Z' : '') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function html(data, now) {
    if (!data || !data.sessions) return '<p class="pbmsg">PLAYBOOK NOT_IN_DATA (run MyTradingSys/tools/live_aid/daily_playbook.py)</p>';
    var nn = nowSessions(now), h = '';
    if (stale(data, now)) h += '<p class="pbmsg stale">PLAYBOOK STALE: built for ' + esc(data.day) + ' at ' + esc(data.built_utc) + '; run daily_playbook.py</p>';
    // the one-line level wall (11 levels) and the analyst list moved to the Map ladder (map.js + level_registry.js): a level shows once, there.
    h += '<div class="pbg">' + data.sessions.map(function (c) { return card(c, now, nn); }).join('') + '</div>';
    h += yesterday(data.yesterday);
    // the next event is the countdown chip on the Map (deduped there)
    h += '<div class="pbr dim">Ledger: ' + esc(String(data.ledger || '').split('\n')[0]) + '</div><ul class="pbn">' + (data.notes || []).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
    return h;
  }
  function summary(data, now) {
    if (!data || !data.sessions) return 'PLAYBOOK NOT_IN_DATA';
    var nn = nowSessions(now), cs = data.sessions.filter(function (c) { return nn.indexOf(c.name) >= 0; }), tag = 'now';
    if (!cs.length) { cs = data.sessions.filter(function (c) { return c.start_ms > now; }).slice(0, 1); tag = 'next'; }
    var y = data.yesterday || { hit: 0, miss: 0 };
    var head = cs.length ? cs.map(function (c) { return c.name; }).join('+') + ' ' + tag + ': ' + cs.reduce(function (n, c) { return n + c.scenarios.length; }, 0) + ' maps' +
      (cs[0].base && cs[0].base.n ? ', usual range ' + p2(cs[0].base.range_p50) : '') : 'no session left today';
    return (stale(data, now) ? 'STALE ' : '') + head + ' &middot; yesterday HIT ' + y.hit + ' MISS ' + y.miss;
  }
  var api = { SESSIONS: SESSIONS, STALE_MS: STALE_MS, nowSessions: nowSessions, gradeClass: gradeClass, stale: stale, html: html, summary: summary };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.PLAYBOOK = api;
})(typeof window !== 'undefined' ? window : this);
</script>
