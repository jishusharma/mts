<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Desk</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e3e3df; --pass:#1e8449; --fail:#c0392b; --wait:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --card:#212225; --ink:#e8e8e6; --mute:#9aa0a6; --line:#33353a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:14px 16px; }
  h1 { font-size:16px; margin:0 0 8px; font-weight:600; }
  .strip { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px 12px; background:var(--card);
           border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--mute); gap:2px; }
  select, input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:4px 6px; }
  button { font:inherit; font-weight:600; border:0; border-radius:6px; padding:8px 18px; background:#2563eb; color:#fff; cursor:pointer; align-self:end; }
  button:disabled { opacity:.5; cursor:default; }
  .say { color:var(--mute); font-size:12px; margin:6px 2px 10px; }
  .verdict { border-radius:8px; padding:10px 14px; color:#fff; font-weight:600; display:none; }
  .verdict small { display:block; font-weight:400; opacity:.95; }
  .nums { display:flex; gap:12px; margin:10px 0; flex-wrap:wrap; }
  .num { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-width:150px; }
  .num b { display:block; font-size:20px; }
  .num span { font-size:12px; color:var(--mute); }
  #tl { display:none; margin:10px 0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  #tl .scroll { max-height:220px; overflow:auto; }
  #tl table { border-collapse:collapse; font-size:12px; width:100%; }
  #tl td, #tl th { padding:2px 8px; text-align:right; border-bottom:1px solid var(--line); }
  #tl tr.t { cursor:pointer; } #tl tr.t:hover, #tl tr.on { background:var(--bg); }
  #tchart svg { width:100%; max-width:640px; height:auto; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .charts { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; }
  .charts figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:8px; padding:4px; }
  .charts svg { width:100%; height:auto; display:block; }
  footer { color:var(--mute); font-size:12px; margin-top:10px; }
  #qs { margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  #qs h2 { font-size:14px; margin:0 0 4px; }
  .q { border-top:1px solid var(--line); padding:8px 0; }
  .q:first-of-type { border-top:0; }
  .q p { margin:2px 0; font-size:13px; }
  .q .mute { color:var(--mute); font-size:12px; }
  .q .opts { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }
  .q .opts button { background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:4px 10px; font-weight:500; }
  .q .opts button.on { background:#2563eb; color:#fff; border-color:#2563eb; }
  .q textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:4px 6px; min-height:34px; }
  .err { color:var(--fail); }
  #equity { display:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0; }
  #equity svg { width:100%; height:180px; display:block; }
  #equity .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--mute); }
  #equity input[type=range] { flex:1; min-width:160px; }
  #equity table { border-collapse:collapse; font-size:12px; margin-top:6px; }
  #equity td, #equity th { border:1px solid var(--line); padding:2px 8px; text-align:right; }
</style>
</head>
<body>
<main>
  <h1 id="title">Simulator desk</h1>
  <div class="strip" id="form"></div>
  <details class="strip" id="cond"><summary>Conditions (optional, apply to any layer; all values are ours)</summary><div id="condfields"></div></details>
  <div class="say" id="say"></div>
  <div class="verdict" id="verdict"></div>
  <div class="nums" id="nums"></div>
  <div id="equity"><div class="row"><b style="color:var(--ink)">Equity curve</b>
    <select id="equnit"><option value="usd">$1,000, 1 % risked per trade</option><option value="r">cumulative R</option></select>
    <button id="pinA">Keep this run as A</button><span id="eqread"></span></div>
    <svg id="eqsvg" viewBox="0 0 600 180" preserveAspectRatio="none"></svg>
    <div class="row"><input type="range" id="eqscrub" min="0" max="0" value="0"><span id="eqwhen"></span></div>
    <table id="eqcmp"></table></div>
  <div id="tl"><b>Filled trades</b> <span class="mute" style="font-size:12px">click a row to see its candle chart</span><div class="scroll"><table id="tltab"></table></div><div id="tchart"></div></div>
  <div class="charts" id="charts"></div>
  <footer id="foot"></footer>
  <section id="qs"><h2>Questions for you</h2><div id="qlist"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
let study = null;
const COLORS = { 'PASSED': 'var(--pass)', 'FAILED': 'var(--fail)', 'NOT ENOUGH DATA': 'var(--wait)' };

function field(f, v) {
  const l = document.createElement('label');
  l.textContent = f.label;
  let el;
  if (f.choices) {
    el = document.createElement('select');
    for (const [k, txt] of Object.entries(f.choices)) {
      const o = document.createElement('option'); o.value = k; o.textContent = txt; el.appendChild(o);
    }
  } else {
    el = document.createElement('input');
    el.type = f.date ? 'date' : 'number';
    if (f.min !== undefined) el.min = f.min;
    if (f.max !== undefined) el.max = f.max;
    if (f.step) el.step = f.step;
  }
  el.name = f.name; el.value = v ?? '';
  l.appendChild(el);
  return l;
}

let studies = [];
async function init() {
  studies = await (await fetch('/api/studies')).json();
  pickStudy(studies[0].id);
  buildConditions();
  loadQuestions();
}

function pickStudy(id) {
  study = studies.find(s => s.id === id);
  $('title').textContent = 'Simulator desk: ' + study.title;
  const form = $('form'); form.innerHTML = '';
  if (studies.length > 1) {            // a picker only once there is a second study
    const l = document.createElement('label'); l.textContent = 'Study';
    const sel = document.createElement('select');
    for (const s of studies) { const o = document.createElement('option'); o.value = s.id; o.textContent = s.title; sel.appendChild(o); }
    sel.value = study.id; sel.dataset.picker = '1'; sel.onchange = () => pickStudy(sel.value);
    l.appendChild(sel); form.appendChild(l);
  }
  for (const f of study.params) form.appendChild(field(f, study.defaults[f.name]));
  const ex = form.querySelector('[name=exit]'), tr = form.querySelector('[name=target_r]');
  if (ex && tr) { const grey = () => { tr.disabled = ex.value !== 'R'; }; ex.onchange = grey; grey(); }
  const b = document.createElement('button'); b.id = 'run'; b.textContent = 'Run'; b.onclick = run;
  form.appendChild(b);
  $('foot').textContent = `Tries on this desk so far: ${study.tries}. Test window: development data only (2022-04-01 to 2024-06-30).`;
}

async function buildConditions() {
  const c = await (await fetch('/api/conditions')).json();
  const box = $('condfields'); box.innerHTML = '';
  for (const f of c.fields) {
    const l = document.createElement('label'); l.textContent = f.label;
    let el;
    if (f.type === 'choice') {
      el = document.createElement('select');
      for (const k of f.choices) { const o = document.createElement('option'); o.value = k; o.textContent = k; el.appendChild(o); }
      el.value = c.defaults[f.key];
    } else {
      el = document.createElement('input'); el.type = f.type === 'int' ? 'number' : 'text';
      if (f.min !== undefined) el.min = f.min;
      if (f.max !== undefined) el.max = f.max;
      el.placeholder = f.type === 'int' && c.defaults[f.key] !== null ? 'default ' + c.defaults[f.key] : 'off';
    }
    if (f.key === 'layer_b') el.placeholder = 'off (' + c.layers.join(', ') + ')';
    el.name = f.key; l.appendChild(el); box.appendChild(l);
  }
}

function condValues() {
  const c = {};
  for (const el of $('condfields').querySelectorAll('select, input')) if (el.value !== '') c[el.name] = el.type === 'number' ? Number(el.value) : el.value;
  return c;
}

async function loadQuestions() {
  const qs = await (await fetch('/api/questions')).json();
  const list = $('qlist'); list.innerHTML = '';
  for (const q of qs) {
    const d = document.createElement('div'); d.className = 'q';
    const t = document.createElement('p'); t.innerHTML = '<b></b>'; t.firstChild.textContent = q.question;
    const c = document.createElement('p'); c.textContent = q.context;
    const df = document.createElement('p'); df.className = 'mute'; df.textContent = 'If you say nothing: ' + q.default;
    const opts = document.createElement('div'); opts.className = 'opts';
    const box = document.createElement('textarea'); box.placeholder = 'Anything to add (optional)';
    const st = document.createElement('p'); st.className = 'mute';
    if (q.answer) { box.value = q.answer.text || ''; st.textContent = `Your answer (${q.answer.at}): ${q.answer.choice}`; }
    for (const o of q.options) {
      const b = document.createElement('button'); b.textContent = o;
      if (q.answer && q.answer.choice === o) b.className = 'on';
      b.onclick = async () => {
        const r = await fetch('/api/answer', { method:'POST', headers:{'Content-Type':'application/json'},
                                               body: JSON.stringify({ id: q.id, choice: o, text: box.value }) });
        const a = await r.json();
        if (!r.ok) { st.textContent = a.error; return; }
        for (const x of opts.children) x.className = x === b ? 'on' : '';
        st.textContent = `Saved (${a.at}): ${a.choice}. The next session reads this.`;
      };
      opts.appendChild(b);
    }
    d.append(t, c, df, opts, box, st); list.appendChild(d);
  }
}

function values() {
  const p = {};
  for (const el of $('form').querySelectorAll('select, input')) if (el.value !== '' && !el.disabled && !el.dataset.picker) p[el.name] = el.type === 'number' ? Number(el.value) : el.value;
  return p;
}

async function run() {
  $('run').disabled = true; $('say').className = 'say'; $('say').textContent = 'Running...';
  const poll = setInterval(async () => {
    try { const p = await (await fetch('/api/progress')).json(); if (p.line) $('say').textContent = p.line; } catch (e) {}
  }, 1000);
  try {
    const r = await fetch('/api/run', { method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify({ study: study.id, params: values(), cond: condValues() }) });
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || r.statusText);
    o.study_id = study.id; o.params_sent = values(); o.cond_sent = condValues();
    show(o);
  } catch (e) {
    $('say').className = 'say err'; $('say').textContent = e.message;
  } finally { clearInterval(poll); $('run').disabled = false; }
}

let cur = null, pinned = null;
function eqDraw() {
  const box = $('equity');
  if (!cur || !cur.curve || !cur.curve.n) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const u = $('equnit').value, runs = [[cur, 'var(--ink)', 'B (this run)']];
  if (pinned) runs.unshift([pinned, '#2563eb', 'A (kept)']);
  const ys = runs.flatMap(r => r[0].curve[u]).concat(u === 'usd' ? [cur.curve.start_usd] : [0]);
  const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const xmax = Math.max(...runs.map(r => r[0].curve.n));
  const X = i => 600 * i / Math.max(xmax - 1, 1), Y = v => 175 - 170 * (v - lo) / span;
  let svg = `<line x1="0" x2="600" y1="${Y(u === 'usd' ? cur.curve.start_usd : 0)}" y2="${Y(u === 'usd' ? cur.curve.start_usd : 0)}" stroke="var(--line)" stroke-dasharray="4"/>`;
  { // drawdown shaded under the running peak of this run
    const c = cur.curve, v = c[u]; let peak = -Infinity; const top = [], bot = [];
    v.forEach((y, i) => { peak = Math.max(peak, y, u === 'usd' ? c.start_usd : 0); top.push(X(c.idx[i] - 1) + ',' + Y(peak)); bot.push(X(c.idx[i] - 1) + ',' + Y(y)); });
    svg += `<polygon fill="var(--fail)" opacity=".22" points="${top.join(' ')} ${bot.reverse().join(' ')}"/>`;
  }
  for (const [o, col] of runs) {
    const c = o.curve; svg += `<polyline fill="none" stroke="${col}" stroke-width="1.6" points="${c.idx.map((k, i) => X(k - 1) + ',' + Y(c[u][i])).join(' ')}"/>`;
  }
  svg += '<line id="eqcur" y1="0" y2="180" stroke="#d97706" stroke-width="1"/>';
  $('eqsvg').innerHTML = svg;
  const sc = $('eqscrub'); sc.max = cur.curve.idx.length - 1; sc.value = sc.max;
  const move = () => {
    const c = cur.curve, i = Number(sc.value), k = c.idx[i];
    $('eqcur').setAttribute('x1', X(k - 1)); $('eqcur').setAttribute('x2', X(k - 1));
    const day = new Date(c.t[i]).toISOString().slice(0, 10);
    $('eqwhen').textContent = `trade ${k} of ${c.n}, ${day}`;
    $('eqread').textContent = `${c.r[i] >= 0 ? '+' : ''}${c.r[i].toFixed(2)} R = $${c.usd[i].toFixed(0)}; worst drawdown ${(cur.numbers.max_dd_r).toFixed(1)} R (shaded)`;
  };
  sc.oninput = move; move();
  const row = (o, name) => `<tr><th>${name}</th><td>${o.verdict}</td><td>${o.n}</td><td>${fmt(o.mean)} R</td><td>${fmt(o.lo)} to ${fmt(o.hi)}</td><td>$${o.curve.usd[o.curve.usd.length - 1].toFixed(0)}</td><td>${o.cond_label || 'no condition'}</td></tr>`;
  $('eqcmp').innerHTML = '<tr><th></th><td>verdict</td><td>trades</td><td>average</td><td>95 % range</td><td>end $</td><td>condition</td></tr>' +
    (pinned ? row(pinned, 'A') : '') + row(cur, pinned ? 'B' : 'this run');
}
$('equnit').onchange = eqDraw;
$('pinA').onclick = () => { pinned = cur; eqDraw(); };

function fmt(x, d = 3) { return x === null || x === undefined ? '-' : (x >= 0 ? '+' : '') + x.toFixed(d); }

function tradeList(o) {
  const L = o.trades, box = $('tl');
  if (!L || !L.t.length) { box.style.display = 'none'; return; }
  box.style.display = 'block'; $('tchart').innerHTML = '';
  let h = '<tr><th>#</th><th>date (UTC)</th><th>side</th><th>net R</th><th>running R</th></tr>';
  L.t.forEach((t, k) => { h += `<tr class="t" data-k="${k}"><td>${k + 1}</td><td>${new Date(t).toISOString().slice(0, 16).replace('T', ' ')}</td><td>${L.side[k] > 0 ? 'long' : L.side[k] < 0 ? 'short' : '-'}</td><td>${fmt(L.r[k], 2)}</td><td>${fmt(L.cum[k], 2)}</td></tr>`; });
  const tab = $('tltab'); tab.innerHTML = h;
  tab.onclick = async e => {
    const tr = e.target.closest('tr.t'); if (!tr) return;
    for (const x of tab.querySelectorAll('tr.on')) x.className = 't';
    tr.className = 't on'; $('tchart').textContent = 'Loading chart...';
    try {
      const r = await fetch('/api/trade', { method:'POST', headers:{'Content-Type':'application/json'},
                                           body: JSON.stringify({ study: o.study_id, params: o.params_sent, cond: o.cond_sent, i: L.i[Number(tr.dataset.k)] }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      if (j.svg) $('tchart').innerHTML = j.svg; else $('tchart').textContent = 'No chart for this trade.';
    } catch (err) { $('tchart').textContent = err.message; }
  };
}

function show(o) {
  cur = o; eqDraw(); tradeList(o);
  $('say').textContent = o.describe;
  const v = $('verdict');
  v.style.display = 'block'; v.style.background = COLORS[o.verdict] || 'var(--mute)';
  v.innerHTML = '';
  v.append(o.verdict + ' ');
  const s = document.createElement('small');
  s.textContent = o.reason + `. Try #${o.try_no} on this data: the best of many tries looks better than it is.`;
  v.appendChild(s);
  $('nums').innerHTML = '';
  const nums = [[o.n, `trades (${o.nofill} ideas never filled)`], [fmt(o.mean) + ' R', `average per trade after fees (95 % range ${fmt(o.lo)} to ${fmt(o.hi)})`],
                [o.streak, 'worst losing streak']];
  for (const [b, t] of nums) {
    const d = document.createElement('div'); d.className = 'num';
    const bb = document.createElement('b'); bb.textContent = b; const sp = document.createElement('span'); sp.textContent = t;
    d.append(bb, sp); $('nums').appendChild(d);
  }
  const k = o.numbers || {};
  if (k.n) {
    const pf = k.profit_factor === null ? 'no losses' : k.profit_factor.toFixed(2);
    const more = [[(k.win_rate * 100).toFixed(1) + ' %', 'trades that won'], [pf, 'profit factor (wins / losses)'], [k.max_dd_r.toFixed(1) + ' R', 'max drawdown (peak to trough)'],
                  [`${fmt(k.mean_gross, 2)} / -${k.mean_fee.toFixed(2)} / ${fmt(k.mean_net, 2)} R`, 'per trade: before fees / fees / after fees']];
    for (const [b, t] of more) {
      const d = document.createElement('div'); d.className = 'num';
      const bb = document.createElement('b'); bb.textContent = b; const sp = document.createElement('span'); sp.textContent = t;
      d.append(bb, sp); $('nums').appendChild(d);
    }
  }
  $('charts').innerHTML = '';
  for (const c of o.charts) {
    const f = document.createElement('figure'); f.innerHTML = c.svg; f.title = 'typical ' + c.kind; $('charts').appendChild(f);
  }
  $('foot').textContent =
    (o.charts.length ? 'Charts: 3 winners and 3 losers closest to the typical winner and loser. ' : '') +
    (o.cond_label ? `Condition: ${o.cond_label} (${o.n_before_cond} filled trades before it). ` : '') +
    `Run time ${o.run_seconds} s${o.cached ? ' (cached)' : ''}. ` +
    (o.already_tried ? 'Same settings as an earlier try: not logged again. ' : `Trial #${o.try_no} logged. `) +
    `Setups tried on this data so far: ${o.try_no} here + ${o.prior_tries} by the original study.`;
}
init();
</script>
</body>
</html>
