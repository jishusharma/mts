<svg xmlns="http://www.w3.org/2000/svg" aria-label="Extreme funding marks a crowded side; the rule fades it, with a CVD divergence as confirmation" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="200" rx="12" fill="#141B24"/><rect x="0" y="210" width="880" height="190" rx="12" fill="#141B24"/><polyline points="60,170 260,130 460,70 600,50 720,70 820,120" fill="none" stroke="#E8EDF2" stroke-width="5"/><circle cx="600" cy="50" r="12" fill="#E5534B"/><line x1="620" y1="80" x2="800" y2="150" stroke="#E5534B" stroke-width="5"/><circle cx="800" cy="150" r="8" fill="#E5534B"/><text x="640" y="40" font-family="Arial" font-size="20" fill="#E5534B">fade: short the crowd</text><text x="60" y="30" font-family="Arial" font-size="20" fill="#C9D1D9">price run, CVD fails to confirm</text><polyline points="60,370 260,340 460,300 600,262 720,280 820,320" fill="none" stroke="#F2A23A" stroke-width="5"/><line x1="40" y1="290" x2="850" y2="290" stroke="#E5534B" stroke-width="2" stroke-dasharray="10 8"/><text x="60" y="240" font-family="Arial" font-size="20" fill="#F2A23A">funding percentile above 0.95 or below 0.05</text><text x="520" y="392" font-family="Arial" font-size="20" fill="#C9D1D9">threshold is OURS</text></svg>