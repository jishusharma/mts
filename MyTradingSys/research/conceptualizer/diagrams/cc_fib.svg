<svg xmlns="http://www.w3.org/2000/svg" aria-label="Impulse leg then a pullback into the 0.618 to 0.786 retracement zone, entry at the near edge" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="80,330 200,220 250,260 360,70 430,150 500,235 560,250 640,150 740,90" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><rect x="360" y="231" width="470" height="44" fill="#5AA9E6" opacity="0.2"/><line x1="360" y1="231" x2="830" y2="231" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><line x1="360" y1="274" x2="830" y2="274" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><circle cx="500" cy="233" r="12" fill="#4CC38A"/><line x1="360" y1="300" x2="830" y2="300" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><text x="24" y="60" font-family="Arial" font-size="18" fill="#C9D1D9">high</text><text x="24" y="330" font-family="Arial" font-size="18" fill="#C9D1D9">low</text><text x="370" y="224" font-family="Arial" font-size="16" fill="#5AA9E6">0.618</text><text x="370" y="294" font-family="Arial" font-size="16" fill="#5AA9E6">0.786</text><text x="520" y="224" font-family="Arial" font-size="18" fill="#4CC38A">limit entry</text><text x="520" y="322" font-family="Arial" font-size="18" fill="#F2A23A">stop beyond zone</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">His words: 618 to 786, there is no fixed answer</text></svg>