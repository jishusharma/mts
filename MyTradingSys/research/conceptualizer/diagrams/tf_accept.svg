<svg xmlns="http://www.w3.org/2000/svg" aria-label="Left: a wick pokes above the level and closes back inside, fast rejection. Right: two closes above the level and the retest holds, acceptance." width="880" height="600" viewBox="0 0 880 600"><rect x="0" y="0" width="430" height="600" rx="12" fill="#141B24"/><rect x="450" y="0" width="430" height="600" rx="12" fill="#141B24"/><line x1="20" y1="220" x2="410" y2="220" stroke="#A3B1BF" stroke-width="3" stroke-dasharray="10 8"/><line x1="470" y1="220" x2="860" y2="220" stroke="#A3B1BF" stroke-width="3" stroke-dasharray="10 8"/><line x1="78" y1="250" x2="78" y2="310" stroke="#5AA9E6" stroke-width="3"/><rect x="60" y="260" width="36" height="40" fill="#5AA9E6"/><line x1="158" y1="140" x2="158" y2="262" stroke="#E8EDF2" stroke-width="3"/><rect x="140" y="232" width="36" height="23" fill="#5AA9E6" stroke="#E8EDF2" stroke-width="3"/><line x1="238" y1="228" x2="238" y2="300" stroke="#F2A23A" stroke-width="3"/><rect x="220" y="235" width="36" height="55" fill="#F2A23A"/><line x1="318" y1="278" x2="318" y2="350" stroke="#F2A23A" stroke-width="3"/><rect x="300" y="285" width="36" height="55" fill="#F2A23A"/><line x1="388" y1="330" x2="388" y2="390" stroke="#F2A23A" stroke-width="3"/><rect x="370" y="335" width="36" height="45" fill="#F2A23A"/><line x1="498" y1="250" x2="498" y2="310" stroke="#5AA9E6" stroke-width="3"/><rect x="480" y="260" width="36" height="40" fill="#5AA9E6"/><line x1="578" y1="182" x2="578" y2="270" stroke="#5AA9E6" stroke-width="3"/><rect x="560" y="190" width="36" height="72" fill="#5AA9E6"/><line x1="658" y1="150" x2="658" y2="205" stroke="#5AA9E6" stroke-width="3"/><rect x="640" y="160" width="36" height="40" fill="#5AA9E6"/><line x1="738" y1="168" x2="738" y2="215" stroke="#F2A23A" stroke-width="3"/><rect x="720" y="175" width="36" height="30" fill="#F2A23A"/><line x1="818" y1="100" x2="818" y2="185" stroke="#5AA9E6" stroke-width="3"/><rect x="800" y="110" width="36" height="70" fill="#5AA9E6"/><text x="24" y="50" font-family="Arial" font-size="26" font-weight="700" fill="#F5B86A">FAST REJECTION</text><text x="24" y="470" font-family="Arial" font-size="24" fill="#E8EDF2">wick above, close back in</text><text x="24" y="510" font-family="Arial" font-size="24" fill="#A3B1BF">→ trade back to value</text><text x="474" y="50" font-family="Arial" font-size="26" font-weight="700" fill="#8CC8F5">ACCEPTANCE</text><text x="474" y="470" font-family="Arial" font-size="24" fill="#E8EDF2">2+ closes beyond, retest holds</text><text x="474" y="510" font-family="Arial" font-size="24" fill="#A3B1BF">→ go with it</text><text x="24" y="570" font-family="Arial" font-size="22" fill="#A3B1BF">speed of the rejection = proof (no number given)</text></svg>
