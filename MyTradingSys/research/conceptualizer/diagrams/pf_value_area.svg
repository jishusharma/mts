<svg xmlns="http://www.w3.org/2000/svg" aria-label="Volume profile filter: a setup counts only when the P2 pivot sits inside the 70 percent value area of the swing" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="80" y="140" width="780" height="110" fill="#5AA9E6" opacity="0.12"/><line x1="80" y1="195" x2="860" y2="195" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 6"/><rect x="740" y="62" width="120" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="680" y="87" width="180" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="620" y="142" width="240" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="650" y="177" width="210" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="635" y="192" width="225" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="650" y="202" width="210" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="680" y="217" width="180" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="740" y="242" width="120" height="16" fill="#5AA9E6" opacity="0.55"/><rect x="800" y="277" width="60" height="16" fill="#5AA9E6" opacity="0.55"/><text x="100" y="128" font-family="Arial" font-size="18" fill="#5AA9E6" text-anchor="start">Value Area: 70% of the swing volume</text><text x="100" y="190" font-family="Arial" font-size="18" fill="#F2A23A" text-anchor="start">POC (most traded price)</text><polyline points="100,330 200,260 260,290 340,200 400,225" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="400" cy="225" r="13" fill="#4CC38A"/><text x="412" y="262" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="start">P2 inside the Value Area = confluent</text><circle cx="200" cy="260" r="8" fill="#A3B1BF"/><text x="215" y="320" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">P2 outside: filtered out</text><text x="100" y="375" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">filter idea: lifts the mean about 0.2 pp, inside noise</text></svg>