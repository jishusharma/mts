<svg xmlns="http://www.w3.org/2000/svg" aria-label="Stop at the invalidation point versus a tiny fixed percent buffer, with the cost per R shown" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,250 160,200 240,215 330,170 420,200 500,200 580,150 700,90" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="420" y1="200" x2="830" y2="200" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><circle cx="500" cy="200" r="12" fill="#4CC38A"/><line x1="420" y1="212" x2="830" y2="212" stroke="#E5534B" stroke-width="3" stroke-dasharray="10 8"/><line x1="420" y1="300" x2="830" y2="300" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><line x1="420" y1="110" x2="830" y2="110" stroke="#4CC38A" stroke-width="3" stroke-dasharray="10 8"/><text x="60" y="60" font-family="Arial" font-size="20" fill="#5AA9E6">Entry at the structural level</text><text x="430" y="190" font-family="Arial" font-size="16" fill="#5AA9E6">entry</text><text x="440" y="240" font-family="Arial" font-size="16" fill="#E5534B">0.1% buffer: NO-SOURCE, fees = 1 R</text><text x="440" y="325" font-family="Arial" font-size="17" fill="#F2A23A">invalidation + 1.0x ATR (OURS)</text><text x="440" y="104" font-family="Arial" font-size="17" fill="#4CC38A">1.5 R target (OURS)</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">His words: your stop reflects your invalidation; no number</text></svg>