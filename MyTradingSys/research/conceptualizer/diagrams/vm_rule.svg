<svg xmlns="http://www.w3.org/2000/svg" aria-label="Long when price rises through the previous daily open, exit on the first daily close below the prior close" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/>
<line x1="40" y1="230" x2="850" y2="230" stroke="#F2A23A" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="222" font-family="Arial" font-size="17" fill="#F2A23A">previous daily open</text>
<polyline points="40,280 130,260 220,235 300,210 400,190 500,180 600,200 700,170 780,205 850,250" fill="none" stroke="#E8EDF2" stroke-width="5"/>
<circle cx="220" cy="235" r="12" fill="#4CC38A"/>
<circle cx="780" cy="205" r="12" fill="#E5534B"/>
<text x="100" y="300" font-family="Arial" font-size="18" fill="#4CC38A">enter: price up through level</text>
<text x="560" y="260" font-family="Arial" font-size="18" fill="#E5534B">exit: close below prior close</text>
<text x="48" y="340" font-family="Arial" font-size="18" fill="#C9D1D9">571 trades, net -0.7 bp; no better than random (p 0.789)</text>
</svg>