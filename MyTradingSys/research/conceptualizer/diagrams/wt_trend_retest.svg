<svg xmlns="http://www.w3.org/2000/svg" aria-label="Sell dot below the 200 average, then a retest of the dot bar midpoint within six bars as the entry" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="80,110 860,230" fill="none" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><text x="700" y="130" font-family="Arial" font-size="18" fill="#F2A23A" text-anchor="start">SMA 200</text><polyline points="90,100 170,150 230,125 300,175 360,150 420,205 470,185 520,235 570,215" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="420" cy="205" r="12" fill="#E5534B"/><text x="405" y="245" font-family="Arial" font-size="18" fill="#E5534B" text-anchor="end">sell dot (WT beyond +53)</text><line x1="420" y1="170" x2="640" y2="170" stroke="#5AA9E6" stroke-width="2" stroke-dasharray="6 6"/><text x="645" y="175" font-family="Arial" font-size="18" fill="#5AA9E6" text-anchor="start">dot-bar midpoint</text><circle cx="560" cy="170" r="13" fill="none" stroke="#4CC38A" stroke-width="3"/><text x="560" y="142" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="middle">retest within 6 bars</text><line x1="560" y1="180" x2="600" y2="260" stroke="#E5534B" stroke-width="4"/><polygon points="600,260 589,251 599,246" fill="#E5534B"/><text x="615" y="285" font-family="Arial" font-size="18" fill="#E5534B" text-anchor="start">entry: short, with the trend</text><text x="100" y="385" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">operator: buy dots in a downtrend are invalid; wait for the retest</text></svg>