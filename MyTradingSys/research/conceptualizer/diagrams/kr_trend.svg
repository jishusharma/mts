<svg xmlns="http://www.w3.org/2000/svg" aria-label="Uptrend with dominant higher lows; a reversal is confirmed only by a close below the dominant higher low" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,330 130,250 180,290 270,170 320,215 420,100 480,150 540,200 600,250 680,300" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="320" y1="215" x2="830" y2="215" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><circle cx="320" cy="215" r="9" fill="#5AA9E6"/><circle cx="600" cy="250" r="12" fill="#E5534B"/><text x="60" y="320" font-family="Arial" font-size="16" fill="#C9D1D9">higher lows</text><text x="500" y="205" font-family="Arial" font-size="18" fill="#5AA9E6">dominant higher low</text><text x="630" y="240" font-family="Arial" font-size="18" fill="#E5534B">trade and close</text><text x="630" y="262" font-family="Arial" font-size="18" fill="#E5534B">below = reversal</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Three states: uptrend, downtrend, range</text></svg>