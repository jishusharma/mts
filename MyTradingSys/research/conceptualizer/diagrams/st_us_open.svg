<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three session bands Asia EU US with the volume peak at the US open and a coin-flip direction after it" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/>
<rect x="40" y="10" width="260" height="290" fill="#5AA9E6" opacity="0.12"/>
<text x="48" y="34" font-family="Arial" font-size="18" fill="#5AA9E6">Asia</text>
<rect x="300" y="10" width="260" height="290" fill="#F2A23A" opacity="0.12"/>
<text x="308" y="34" font-family="Arial" font-size="18" fill="#F2A23A">EU</text>
<rect x="560" y="10" width="290" height="290" fill="#4CC38A" opacity="0.12"/>
<text x="568" y="34" font-family="Arial" font-size="18" fill="#4CC38A">US open</text>
<line x1="40" y1="250" x2="850" y2="250" stroke="#A3B1BF" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="242" font-family="Arial" font-size="17" fill="#A3B1BF">price at open</text>
<polyline points="40,250 200,240 300,250 430,235 560,250 620,200 700,285 780,225 850,255" fill="none" stroke="#E8EDF2" stroke-width="5"/>
<circle cx="560" cy="250" r="12" fill="#4CC38A"/>
<text x="48" y="340" font-family="Arial" font-size="18" fill="#C9D1D9">busiest 15 min starts at the open: 13:30Z, or 14:30Z after US DST ends</text>
<text x="48" y="368" font-family="Arial" font-size="18" fill="#F2A23A">first 10/15/30 min predicts the rest about 50 percent: a coin flip</text>
</svg>