<svg xmlns="http://www.w3.org/2000/svg" aria-label="Bullish engulfing: a small red candle then a large green candle that covers it, entry at the next open" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/>
<line x1="40" y1="300" x2="850" y2="300" stroke="#A3B1BF" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="292" font-family="Arial" font-size="17" fill="#A3B1BF">prior bar low</text>
<polyline points="40,150 200,190 340,235 480,270 560,250 700,230 850,215" fill="none" stroke="#E8EDF2" stroke-width="5"/>
<circle cx="480" cy="270" r="12" fill="#F2A23A"/>
<text x="300" y="200" font-family="Arial" font-size="18" fill="#F2A23A">small red</text>
<text x="570" y="240" font-family="Arial" font-size="18" fill="#4CC38A">big green covers it: enter</text>
<text x="48" y="340" font-family="Arial" font-size="18" fill="#C9D1D9">1d bull engulf: n 164, net -26 bp. Bear engulf: n 140, net -71 bp</text>
</svg>