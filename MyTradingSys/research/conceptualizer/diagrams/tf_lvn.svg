<svg xmlns="http://www.w3.org/2000/svg" aria-label="Profile with two high-volume humps and a thin waist; price crosses the waist fast, dips back to rebalance, then runs to the next high-volume node" width="880" height="600" viewBox="0 0 880 600"><rect x="0" y="0" width="880" height="600" rx="12" fill="#141B24"/><rect x="20" y="60" width="60" height="34" fill="#2A3644"/><rect x="20" y="100" width="120" height="34" fill="#3A5672"/><rect x="20" y="140" width="200" height="34" fill="#3A5672"/><rect x="20" y="180" width="240" height="34" fill="#5AA9E6"/><rect x="20" y="220" width="200" height="34" fill="#3A5672"/><rect x="20" y="260" width="110" height="34" fill="#3A5672"/><rect x="20" y="300" width="36" height="34" fill="#F2A23A"/><rect x="20" y="340" width="50" height="34" fill="#3A5672"/><rect x="20" y="380" width="140" height="34" fill="#3A5672"/><rect x="20" y="420" width="220" height="34" fill="#3A5672"/><rect x="20" y="460" width="250" height="34" fill="#5AA9E6"/><rect x="20" y="500" width="170" height="34" fill="#3A5672"/><line x1="20" y1="197" x2="860" y2="197" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><line x1="20" y1="317" x2="860" y2="317" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="340,477 420,440 480,340 520,262 560,236 620,300 660,322 720,252 780,205 840,197" fill="none" stroke="#E8EDF2" stroke-width="6" stroke-linejoin="round"/><circle cx="660" cy="322" r="12" fill="#F2A23A"/><circle cx="840" cy="197" r="12" fill="#5AA9E6"/><text x="520" y="380" font-family="Arial" font-size="24" fill="#F5B86A">LVN: crossed fast</text><text x="600" y="355" font-family="Arial" font-size="22" fill="#A3B1BF">rebalance</text><text x="560" y="170" font-family="Arial" font-size="24" font-weight="700" fill="#8CC8F5">TARGET: next HVN</text><text x="300" y="560" font-family="Arial" font-size="22" fill="#A3B1BF">thin zone = floor inside a trend, not a fade</text></svg>
