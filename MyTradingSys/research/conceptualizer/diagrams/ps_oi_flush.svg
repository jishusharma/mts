<svg xmlns="http://www.w3.org/2000/svg" aria-label="Price drops while open interest falls, then price recovers in a V once the forced sellers are gone" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="200" rx="12" fill="#141B24"/><rect x="0" y="210" width="880" height="190" rx="12" fill="#141B24"/><polyline points="60,50 260,60 380,170 480,60 620,40 820,30" fill="none" stroke="#E8EDF2" stroke-width="5"/><circle cx="380" cy="170" r="12" fill="#E5534B"/><text x="400" y="185" font-family="Arial" font-size="20" fill="#E5534B">flush: forced exits</text><polyline points="60,250 260,260 380,380 480,370 620,365 820,360" fill="none" stroke="#5AA9E6" stroke-width="5"/><text x="60" y="235" font-family="Arial" font-size="20" fill="#5AA9E6">open interest steps down</text><line x1="400" y1="150" x2="560" y2="60" stroke="#4CC38A" stroke-width="5"/><circle cx="560" cy="60" r="8" fill="#4CC38A"/><text x="600" y="100" font-family="Arial" font-size="20" fill="#4CC38A">V recovery?</text><text x="500" y="340" font-family="Arial" font-size="20" fill="#C9D1D9">nobody left who wanted to sell</text></svg>