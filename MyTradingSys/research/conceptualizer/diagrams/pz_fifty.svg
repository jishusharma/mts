<svg xmlns="http://www.w3.org/2000/svg" aria-label="The 50 percent line: midpoint of the last major run splits price into a strong half above and a weak half below" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="80" y="40" width="780" height="150" fill="#4CC38A" opacity="0.1"/><rect x="80" y="190" width="780" height="150" fill="#E5534B" opacity="0.1"/><line x1="80" y1="190" x2="860" y2="190" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 6"/><text x="860" y="64" font-family="Arial" font-size="20" font-weight="700" fill="#4CC38A" text-anchor="end">strong half</text><text x="90" y="330" font-family="Arial" font-size="20" font-weight="700" fill="#E5534B" text-anchor="start">weak half</text><text x="860" y="182" font-family="Arial" font-size="18" fill="#F2A23A" text-anchor="end">50% = (top + bottom) / 2</text><polyline points="100,60 200,160 260,120 330,300 400,240" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="100" cy="60" r="8" fill="#E8EDF2"/><circle cx="330" cy="300" r="8" fill="#E8EDF2"/><text x="110" y="45" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">top of run</text><text x="340" y="330" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">bottom of run</text><polyline points="400,240 470,205 520,215" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="520" cy="215" r="12" fill="#E5534B"/><line x1="520" y1="215" x2="570" y2="300" stroke="#E5534B" stroke-width="4"/><polygon points="570,300 559,292 568,286" fill="#E5534B"/><text x="580" y="290" font-family="Arial" font-size="18" fill="#E5534B" text-anchor="start">rejection from below</text><polyline points="620,230 680,200 740,150 800,120" fill="none" stroke="#4CC38A" stroke-width="3" stroke-dasharray="6 6"/><text x="640" y="100" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="start">or: hold above the 50%</text></svg>