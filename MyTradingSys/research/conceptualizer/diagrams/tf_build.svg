<svg xmlns="http://www.w3.org/2000/svg" aria-label="Bars drawn to one scale in basis points: their tiny stop and 4.5R target; the same stop on BTC where a 10 basis point fee is larger than the stop; our census with a wide stop and 1R target" width="880" height="600" viewBox="0 0 880 600"><rect x="0" y="0" width="880" height="600" rx="12" fill="#141B24"/><text x="24" y="44" font-family="Arial" font-size="24" font-weight="700" fill="#8CC8F5">THEIRS · Fabio, NQ futures</text><rect x="40" y="62" width="48" height="50" fill="#F2A23A"/><rect x="88" y="62" width="216" height="50" fill="#5AA9E6"/><rect x="40" y="118" width="6" height="16" fill="#A3B1BF"/><text x="320" y="96" font-family="Arial" font-size="24" fill="#E8EDF2">stop 6bp · target 1 : 4.5 · hit 30–35%</text><text x="60" y="160" font-family="Arial" font-size="22" fill="#A3B1BF">their fee ≈ 0.5–1bp (grey sliver)</text><text x="24" y="224" font-family="Arial" font-size="24" font-weight="700" fill="#F5B86A">SAME STOP · BTC perp</text><rect x="40" y="242" width="48" height="50" fill="#F2A23A"/><rect x="40" y="298" width="80" height="22" fill="#F2A23A" opacity="0.55"/><text x="140" y="282" font-family="Arial" font-size="24" fill="#E8EDF2">fee 10bp &gt; stop → costs 1.2–2.8R per trade</text><text x="140" y="318" font-family="Arial" font-size="22" fill="#A3B1BF">gross +0.079R became −1.423R net</text><text x="24" y="390" font-family="Arial" font-size="24" font-weight="700" fill="#A3B1BF">OURS · auction census</text><rect x="40" y="408" width="320" height="50" fill="#F2A23A"/><rect x="360" y="408" width="320" height="50" fill="#5AA9E6"/><rect x="40" y="464" width="80" height="22" fill="#F2A23A" opacity="0.55"/><text x="700" y="442" font-family="Arial" font-size="24" fill="#E8EDF2">1R</text><text x="140" y="482" font-family="Arial" font-size="22" fill="#A3B1BF">stop ≥ 40bp · 1R bracket · no adds</text><text x="24" y="560" font-family="Arial" font-size="22" fill="#A3B1BF">scale: 8px = 1bp · orange = stop or fee · blue = target</text></svg>
