<svg xmlns="http://www.w3.org/2000/svg" aria-label="Volatility compression, first range-breaking candle with volatility rising, stop on the far side of the range" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,200 120,150 170,230 230,160 290,215 350,170 410,205 470,175 520,195" fill="none" stroke="#E8EDF2" stroke-width="4" stroke-linejoin="round"/><line x1="230" y1="145" x2="520" y2="145" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><line x1="170" y1="235" x2="520" y2="235" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><polyline points="520,195 580,110 680,70 780,45" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><circle cx="580" cy="110" r="12" fill="#4CC38A"/><line x1="520" y1="250" x2="830" y2="250" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="60,345 300,350 520,330 600,290 700,320" fill="none" stroke="#5AA9E6" stroke-width="3" stroke-linejoin="round"/><text x="70" y="130" font-family="Arial" font-size="16" fill="#5AA9E6">compression: BBWP below 30 (OURS)</text><text x="595" y="140" font-family="Arial" font-size="16" fill="#4CC38A">first range break, BBWP above 50</text><text x="530" y="275" font-family="Arial" font-size="16" fill="#F2A23A">stop: far side of range, on a close</text><text x="24" y="385" font-family="Arial" font-size="16" fill="#C9D1D9">Lower line: volatility low, then rising, peak = take profit</text></svg>