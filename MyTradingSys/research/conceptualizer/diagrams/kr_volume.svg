<svg xmlns="http://www.w3.org/2000/svg" aria-label="Volume bars with a 20-bar average line; only a bar at two times the average or more counts" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="60" y="280" width="40" height="50" fill="#5AA9E6" opacity="0.6"/><rect x="130" y="270" width="40" height="60" fill="#5AA9E6" opacity="0.6"/><rect x="200" y="285" width="40" height="45" fill="#5AA9E6" opacity="0.6"/><rect x="270" y="275" width="40" height="55" fill="#5AA9E6" opacity="0.6"/><rect x="340" y="290" width="40" height="40" fill="#5AA9E6" opacity="0.6"/><rect x="410" y="260" width="40" height="70" fill="#5AA9E6" opacity="0.6"/><rect x="480" y="275" width="40" height="55" fill="#5AA9E6" opacity="0.6"/><rect x="550" y="170" width="40" height="160" fill="#5AA9E6" opacity="0.6"/><rect x="620" y="270" width="40" height="60" fill="#5AA9E6" opacity="0.6"/><rect x="690" y="280" width="40" height="50" fill="#5AA9E6" opacity="0.6"/><line x1="60" y1="290" x2="800" y2="290" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><line x1="60" y1="200" x2="800" y2="200" stroke="#E5534B" stroke-width="3" stroke-dasharray="10 8"/><text x="24" y="40" font-family="Arial" font-size="18" fill="#E5534B">2x average: pay attention, likely near a pivot</text><text x="24" y="66" font-family="Arial" font-size="16" fill="#F2A23A">average (SMA 20)</text><circle cx="590" cy="190" r="10" fill="#E5534B"/><text x="610" y="180" font-family="Arial" font-size="16" fill="#E5534B">outsized</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Volume confirms or condemns a signal; it gives no direction</text></svg>