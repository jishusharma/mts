<svg xmlns="http://www.w3.org/2000/svg" aria-label="Level break and retest: two closes above a level confirm the break, then a retest either holds above or fails below" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="80" y1="230" x2="860" y2="230" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 6"/><text x="860" y="222" font-family="Arial" font-size="18" fill="#5AA9E6" text-anchor="end">level X (pivot or 50%)</text><rect x="80" y="215" width="780" height="15" fill="#F2A23A" opacity="0.18"/><polyline points="100,300 180,280 250,255 300,200 360,175 430,185 470,225" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="300" cy="200" r="9" fill="#4CC38A"/><circle cx="360" cy="175" r="9" fill="#4CC38A"/><text x="330" y="150" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="middle">N = 2 closes above</text><circle cx="470" cy="225" r="12" fill="none" stroke="#F2A23A" stroke-width="3"/><text x="470" y="262" font-family="Arial" font-size="18" fill="#F2A23A" text-anchor="middle">retest within R bars</text><polyline points="470,225 540,195 620,160 700,130" fill="none" stroke="#4CC38A" stroke-width="4"/><text x="640" y="185" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="start">hold: close above X</text><polyline points="470,225 540,265 620,300" fill="none" stroke="#E5534B" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="330" font-family="Arial" font-size="18" fill="#E5534B" text-anchor="start">fail: close below X</text><text x="100" y="385" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">touch band tolerance 0.5% (shaded, OURS)</text></svg>