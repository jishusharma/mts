<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three timeframes: daily and 4h structure give few fills, 1h gives many; counts on 30 months" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="60" y="40" width="90" height="40" fill="#5AA9E6" opacity="0.8"/><rect x="60" y="130" width="300" height="40" fill="#F2A23A" opacity="0.8"/><rect x="60" y="220" width="740" height="40" fill="#4CC38A" opacity="0.8"/><text x="170" y="68" font-family="Arial" font-size="20" fill="#C9D1D9">1d: 31 fills</text><text x="380" y="158" font-family="Arial" font-size="20" fill="#C9D1D9">4h: 207 fills</text><text x="70" y="247" font-family="Arial" font-size="20" fill="#0B0F14">1h: 801 fills</text><text x="60" y="112" font-family="Arial" font-size="16" fill="#C9D1D9">structure timeframe his closes use</text><text x="60" y="202" font-family="Arial" font-size="16" fill="#C9D1D9">same-timeframe close, entry on a resting limit</text><text x="60" y="290" font-family="Arial" font-size="16" fill="#C9D1D9">the only timeframe with enough fills</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Setup 1, DEV 2022-01 to 2024-06: fills in 30 months</text></svg>