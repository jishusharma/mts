<svg xmlns="http://www.w3.org/2000/svg" aria-label="Price spikes through the previous day high, closes back inside within 60 minutes, short toward session low, time exit at 14:00 UTC" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/>
<rect x="40" y="10" width="480" height="290" fill="#5AA9E6" opacity="0.12"/>
<text x="48" y="34" font-family="Arial" font-size="18" fill="#5AA9E6">before 14:00 UTC</text>
<rect x="520" y="10" width="330" height="290" fill="#A3B1BF" opacity="0.12"/>
<text x="528" y="34" font-family="Arial" font-size="18" fill="#A3B1BF">time exit</text>
<line x1="40" y1="110" x2="850" y2="110" stroke="#F2A23A" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="102" font-family="Arial" font-size="17" fill="#F2A23A">previous day high</text>
<line x1="40" y1="300" x2="850" y2="300" stroke="#4CC38A" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="292" font-family="Arial" font-size="17" fill="#4CC38A">session low target</text>
<polyline points="40,170 140,150 230,120 300,75 360,150 440,190 520,250 620,290 740,300 850,285" fill="none" stroke="#E8EDF2" stroke-width="5"/>
<circle cx="360" cy="150" r="12" fill="#E5534B"/>
<text x="380" y="140" font-family="Arial" font-size="18" fill="#E5534B">close back inside: enter short</text>
<text x="150" y="70" font-family="Arial" font-size="18" fill="#F2A23A">spike extreme = stop</text>
<text x="48" y="340" font-family="Arial" font-size="18" fill="#C9D1D9">stopped out 60-65 percent of events; target hit about 24 percent</text>
</svg>