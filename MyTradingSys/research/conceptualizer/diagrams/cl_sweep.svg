<svg xmlns="http://www.w3.org/2000/svg" aria-label="Liquidity sweep: equal highs are taken first, then the reversal is acceptable" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="40" y1="120" x2="850" y2="120" stroke="#E5534B" stroke-width="2" stroke-dasharray="10 8"/><text x="50" y="110" font-family="Arial" font-size="20" fill="#E5534B">equal highs / round number</text><polyline points="60,300 180,170 260,240 360,130 440,230 520,100" fill="none" stroke="#E8EDF2" stroke-width="5"/><circle cx="520" cy="100" r="12" fill="#E5534B"/><text x="540" y="90" font-family="Arial" font-size="20" fill="#E5534B">sweep</text><polyline points="520,100 620,200 740,310" fill="none" stroke="#4CC38A" stroke-width="5"/><text x="300" y="370" font-family="Arial" font-size="20" fill="#4CC38A">entry only after the sweep</text><line x1="600" y1="310" x2="850" y2="310" stroke="#F2A23A" stroke-width="2" stroke-dasharray="10 8"/><text x="700" y="300" font-family="Arial" font-size="20" fill="#F2A23A">target</text></svg>