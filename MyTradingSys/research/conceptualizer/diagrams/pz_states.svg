<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three nested swing trend states: 1-bar up, 2-bar up, 3-bar neutral, summed into a confluence score of plus two" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="20" y="20" width="840" height="110" fill="#5AA9E6" opacity="0.06"/><text x="30" y="50" font-family="Arial" font-size="22" font-weight="700" fill="#E8EDF2" text-anchor="start">1-bar</text><polyline points="110,130 190,90 260,125 340,70 430,100 520,50" fill="none" stroke="#E8EDF2" stroke-width="4"/><text x="560" y="82" font-family="Arial" font-size="26" font-weight="700" fill="#4CC38A" text-anchor="start">UP</text><rect x="20" y="145" width="840" height="110" fill="#5AA9E6" opacity="0.06"/><text x="30" y="175" font-family="Arial" font-size="22" font-weight="700" fill="#E8EDF2" text-anchor="start">2-bar</text><polyline points="110,250 210,200 300,235 400,170 480,200" fill="none" stroke="#E8EDF2" stroke-width="4"/><text x="560" y="207" font-family="Arial" font-size="26" font-weight="700" fill="#4CC38A" text-anchor="start">UP</text><rect x="20" y="270" width="840" height="110" fill="#5AA9E6" opacity="0.06"/><text x="30" y="300" font-family="Arial" font-size="22" font-weight="700" fill="#E8EDF2" text-anchor="start">3-bar</text><polyline points="110,370 230,320 330,360 420,310 470,345" fill="none" stroke="#E8EDF2" stroke-width="4"/><text x="560" y="332" font-family="Arial" font-size="26" font-weight="700" fill="#A3B1BF" text-anchor="start">NEUTRAL</text><text x="680" y="36" font-family="Arial" font-size="20" fill="#F2A23A" text-anchor="start">conf = +1 +1 +0 = +2</text><text x="680" y="64" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">mixed, not confluence</text><text x="680" y="92" font-family="Arial" font-size="16" fill="#5AA9E6" text-anchor="start">1-bar turns first</text></svg>