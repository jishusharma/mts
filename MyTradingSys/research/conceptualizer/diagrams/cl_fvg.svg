<svg xmlns="http://www.w3.org/2000/svg" aria-label="Fair value gap: displacement leaves a gap, price retests it and bounces" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="180" y1="260" x2="180" y2="330" stroke="#4CC38A" stroke-width="4"/><rect x="160" y="280" width="40" height="20" fill="#4CC38A"/><line x1="300" y1="120" x2="300" y2="290" stroke="#4CC38A" stroke-width="4"/><rect x="280" y="150" width="40" height="130" fill="#4CC38A"/><line x1="420" y1="100" x2="420" y2="160" stroke="#4CC38A" stroke-width="4"/><rect x="400" y="120" width="40" height="30" fill="#4CC38A"/><rect x="150" y="160" width="520" height="100" fill="#5AA9E6" opacity="0.18"/><text x="480" y="215" font-family="Arial" font-size="20" fill="#5AA9E6">gap (FVG)</text><polyline points="440,120 520,170 580,215 680,100" fill="none" stroke="#E8EDF2" stroke-width="5"/><circle cx="580" cy="215" r="12" fill="#5AA9E6"/><text x="560" y="255" font-family="Arial" font-size="20" fill="#5AA9E6">retest</text><text x="500" y="360" font-family="Arial" font-size="20" fill="#C9D1D9">limit at gap, stop beyond it</text></svg>