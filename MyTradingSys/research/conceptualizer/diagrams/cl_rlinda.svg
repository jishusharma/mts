<svg xmlns="http://www.w3.org/2000/svg" aria-label="Range high false breakout: price pokes above, traps buyers, falls back into the range" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="40" y1="120" x2="850" y2="120" stroke="#5AA9E6" stroke-width="2" stroke-dasharray="10 8"/><line x1="40" y1="320" x2="850" y2="320" stroke="#F2A23A" stroke-width="2" stroke-dasharray="10 8"/><text x="50" y="110" font-family="Arial" font-size="20" fill="#5AA9E6">range high</text><text x="50" y="310" font-family="Arial" font-size="20" fill="#F2A23A">range low</text><polyline points="60,250 200,150 320,230 440,130 520,90 600,160 740,300" fill="none" stroke="#E8EDF2" stroke-width="5"/><circle cx="520" cy="90" r="12" fill="#E5534B"/><text x="540" y="80" font-family="Arial" font-size="20" fill="#E5534B">false breakout</text><line x1="600" y1="160" x2="740" y2="300" stroke="#4CC38A" stroke-width="5"/><circle cx="740" cy="300" r="8" fill="#4CC38A"/><text x="500" y="370" font-family="Arial" font-size="20" fill="#4CC38A">short back to the range</text></svg>