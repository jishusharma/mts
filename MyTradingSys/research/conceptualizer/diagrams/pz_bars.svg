<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three bar count: from a significant low, three consecutive bars with higher highs and higher lows fire the signal" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="80" y1="330" x2="300" y2="330" stroke="#A3B1BF" stroke-width="2" stroke-dasharray="8 6"/><text x="90" y="356" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">significant low (turning point T)</text><line x1="150" y1="300" x2="150" y2="350" stroke="#A3B1BF" stroke-width="3"/><rect x="139" y="320" width="22" height="15" fill="#A3B1BF"/><line x1="260" y1="255" x2="260" y2="310" stroke="#4CC38A" stroke-width="3"/><rect x="249" y="275" width="22" height="25" fill="#4CC38A"/><line x1="370" y1="215" x2="370" y2="280" stroke="#4CC38A" stroke-width="3"/><rect x="359" y="245" width="22" height="25" fill="#4CC38A"/><line x1="480" y1="170" x2="480" y2="245" stroke="#4CC38A" stroke-width="3"/><rect x="469" y="210" width="22" height="25" fill="#4CC38A"/><text x="260" y="190" font-family="Arial" font-size="26" font-weight="700" fill="#F2A23A" text-anchor="middle">1</text><text x="370" y="170" font-family="Arial" font-size="26" font-weight="700" fill="#F2A23A" text-anchor="middle">2</text><text x="480" y="150" font-family="Arial" font-size="26" font-weight="700" fill="#F2A23A" text-anchor="middle">3</text><line x1="590" y1="185" x2="590" y2="235" stroke="#E5534B" stroke-width="3"/><rect x="579" y="215" width="22" height="10" fill="#E5534B"/><text x="590" y="265" font-family="Arial" font-size="16" fill="#E5534B" text-anchor="middle">count stops</text><text x="150" y="290" font-family="Arial" font-size="22" font-weight="700" fill="#E8EDF2" text-anchor="middle">T</text><text x="520" y="60" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">each bar: higher high AND higher low</text><text x="520" y="90" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="start">3 in a row = three_bar signal</text><text x="520" y="120" font-family="Arial" font-size="18" fill="#A3B1BF" text-anchor="start">stays fired after the first miss</text><text x="80" y="385" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">Jason: three bars up from a significant low (D, 3D, W bars)</text></svg>