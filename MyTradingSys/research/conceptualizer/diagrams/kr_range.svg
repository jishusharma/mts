<svg xmlns="http://www.w3.org/2000/svg" aria-label="A range is two zones; trade the floor and the ceiling, the middle is no man's land" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="60" y="80" width="770" height="40" fill="#5AA9E6" opacity="0.22"/><rect x="60" y="260" width="770" height="40" fill="#5AA9E6" opacity="0.22"/><rect x="60" y="120" width="770" height="140" fill="#E5534B" opacity="0.08"/><polyline points="60,280 150,120 250,270 350,95 450,285 550,110 650,270 780,105" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><circle cx="250" cy="270" r="12" fill="#4CC38A"/><circle cx="350" cy="95" r="12" fill="#F2A23A"/><text x="300" y="200" font-family="Arial" font-size="20" fill="#E5534B">middle: no edge</text><text x="70" y="70" font-family="Arial" font-size="18" fill="#5AA9E6">ceiling zone</text><text x="70" y="325" font-family="Arial" font-size="18" fill="#5AA9E6">floor zone</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Edges only, flat in the middle</text></svg>