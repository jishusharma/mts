<svg xmlns="http://www.w3.org/2000/svg" aria-label="Strict bullish engulfing: trades below the prior low and closes above the prior high" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="300" y="150" width="60" height="80" fill="#E5534B"/><line x1="330" y1="120" x2="330" y2="260" stroke="#E5534B" stroke-width="4"/><rect x="440" y="90" width="80" height="190" fill="#4CC38A"/><line x1="480" y1="70" x2="480" y2="300" stroke="#4CC38A" stroke-width="4"/><line x1="250" y1="120" x2="640" y2="120" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><line x1="250" y1="260" x2="640" y2="260" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><text x="540" y="115" font-family="Arial" font-size="17" fill="#4CC38A">close above prior HIGH</text><text x="540" y="285" font-family="Arial" font-size="17" fill="#4CC38A">low below prior LOW</text><text x="270" y="320" font-family="Arial" font-size="16" fill="#E5534B">prior candle</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Near-engulfing does not count; best at a level, on volume</text></svg>