<svg xmlns="http://www.w3.org/2000/svg" aria-label="Lower highs then a candle close above the last lower high: bullish market structure break" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,100 130,190 200,130 270,230 340,170 410,260 480,200 560,110 640,90" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="480" y1="200" x2="830" y2="200" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><circle cx="560" cy="110" r="12" fill="#4CC38A"/><circle cx="130" cy="190" r="8" fill="#F2A23A"/><circle cx="270" cy="230" r="8" fill="#F2A23A"/><circle cx="410" cy="260" r="8" fill="#F2A23A"/><text x="70" y="70" font-family="Arial" font-size="18" fill="#F2A23A">lower highs</text><text x="480" y="295" font-family="Arial" font-size="18" fill="#5AA9E6">last lower high = broken level</text><text x="575" y="100" font-family="Arial" font-size="18" fill="#4CC38A">close above = bull MSB</text><text x="24" y="360" font-family="Arial" font-size="17" fill="#C9D1D9">Structure from candle bodies; a break needs a close</text></svg>