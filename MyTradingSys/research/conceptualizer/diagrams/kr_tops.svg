<svg xmlns="http://www.w3.org/2000/svg" aria-label="Four signals around the same time on a weekly chart: reversal candle, extreme volume, extreme volatility, momentum divergence" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,330 160,260 250,200 340,120 430,80 520,110 600,190 700,270" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><circle cx="430" cy="80" r="12" fill="#E5534B"/><rect x="380" y="40" width="100" height="90" rx="6" fill="none" stroke="#F2A23A" stroke-width="3"/><text x="24" y="40" font-family="Arial" font-size="20" fill="#F2A23A">3 of 4 within a few bars</text><text x="540" y="200" font-family="Arial" font-size="17" fill="#C9D1D9">1 reversal candle</text><text x="540" y="226" font-family="Arial" font-size="17" fill="#C9D1D9">2 volume at 2x its 30-day average</text><text x="540" y="252" font-family="Arial" font-size="17" fill="#C9D1D9">3 volatility (BBWP above 85)</text><text x="540" y="278" font-family="Arial" font-size="17" fill="#C9D1D9">4 RSI divergence or MACD cross</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">A sell signal for long holders, not a short entry</text></svg>