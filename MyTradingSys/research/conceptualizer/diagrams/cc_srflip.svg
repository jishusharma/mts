<svg xmlns="http://www.w3.org/2000/svg" aria-label="Price breaks above resistance, pulls back to the broken level and bounces: support and resistance flip" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,270 120,190 170,240 230,175 280,240 340,120 400,90 470,150 520,165 600,110 700,70" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="60" y1="170" x2="830" y2="170" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><circle cx="520" cy="168" r="12" fill="#4CC38A"/><line x1="430" y1="215" x2="830" y2="215" stroke="#F2A23A" stroke-width="3" stroke-dasharray="10 8"/><line x1="560" y1="40" x2="830" y2="40" stroke="#4CC38A" stroke-width="3" stroke-dasharray="10 8"/><text x="70" y="150" font-family="Arial" font-size="18" fill="#5AA9E6">resistance</text><text x="540" y="200" font-family="Arial" font-size="18" fill="#4CC38A">entry: retest of broken level</text><text x="440" y="245" font-family="Arial" font-size="18" fill="#F2A23A">stop: invalidation (level lost)</text><text x="600" y="34" font-family="Arial" font-size="18" fill="#4CC38A">target</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Broken resistance turns support on the re-test</text></svg>