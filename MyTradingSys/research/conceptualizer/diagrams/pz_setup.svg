<svg xmlns="http://www.w3.org/2000/svg" aria-label="Combined setup: a held retest with confluence, entry at the next open, stop at the last swing low and target at the next pivot high" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><line x1="80" y1="220" x2="860" y2="220" stroke="#5AA9E6" stroke-width="2" stroke-dasharray="10 6"/><text x="90" y="212" font-family="Arial" font-size="18" fill="#5AA9E6" text-anchor="start">X</text><polyline points="100,340 180,300 240,250 300,170 360,200 420,235 470,225 520,190" fill="none" stroke="#E8EDF2" stroke-width="4"/><circle cx="470" cy="225" r="10" fill="#4CC38A"/><text x="470" y="262" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="middle">retest holds, conf >= +2</text><line x1="470" y1="225" x2="520" y2="200" stroke="#4CC38A" stroke-width="4"/><polygon points="520,200 511,211 506,201" fill="#4CC38A"/><text x="530" y="215" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="start">entry: next open</text><line x1="300" y1="300" x2="800" y2="300" stroke="#E5534B" stroke-width="3" stroke-dasharray="8 6"/><text x="800" y="325" font-family="Arial" font-size="18" fill="#E5534B" text-anchor="end">stop: last 1-bar swing low</text><line x1="300" y1="95" x2="800" y2="95" stroke="#4CC38A" stroke-width="3" stroke-dasharray="8 6"/><text x="800" y="80" font-family="Arial" font-size="18" fill="#4CC38A" text-anchor="end">target: next pivot high above</text><text x="100" y="30" font-family="Arial" font-size="18" fill="#C9D1D9" text-anchor="start">skip if reward / risk below 1.0; time stop 20 bars</text><text x="100" y="385" font-family="Arial" font-size="16" fill="#A3B1BF" text-anchor="start">only the next-pivot target and the break-of-trend invalidation are sourced</text></svg>