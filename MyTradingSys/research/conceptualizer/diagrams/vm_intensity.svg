<svg xmlns="http://www.w3.org/2000/svg" aria-label="Volume spike bar before a larger next bar, direction of the next bar is a coin flip" width="880" height="400" viewBox="0 0 880 400">
<rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/>
<line x1="40" y1="250" x2="850" y2="250" stroke="#A3B1BF" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="242" font-family="Arial" font-size="17" fill="#A3B1BF">price</text>
<polyline points="40,250 160,245 280,255 400,250 480,246 560,200 640,290 740,215 850,240" fill="none" stroke="#E8EDF2" stroke-width="5"/>
<circle cx="480" cy="246" r="12" fill="#F2A23A"/>
<text x="48" y="60" font-family="Arial" font-size="18" fill="#F2A23A">spike: volume 2-3x normal</text>
<text x="480" y="330" font-family="Arial" font-size="18" fill="#5AA9E6">next bar: range 1.25-1.40x</text>
<text x="48" y="360" font-family="Arial" font-size="18" fill="#C9D1D9">size of next move: yes (corr 0.42-0.49). Direction: no (corr 0.01-0.04)</text>
</svg>