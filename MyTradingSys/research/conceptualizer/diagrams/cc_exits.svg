<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three exit styles: trailing stop under swing lows, fixed target, first trouble area" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><polyline points="60,330 150,270 200,300 300,200 350,235 480,130 530,170 660,70 760,50" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><polyline points="60,345 200,325 350,255 530,190 700,95" fill="none" stroke="#F2A23A" stroke-width="4" stroke-dasharray="3 7"/><line x1="300" y1="120" x2="830" y2="120" stroke="#4CC38A" stroke-width="3" stroke-dasharray="10 8"/><line x1="300" y1="165" x2="830" y2="165" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><text x="24" y="30" font-family="Arial" font-size="17" fill="#F2A23A">Trailing: stop under each swing low (trend)</text><text x="24" y="56" font-family="Arial" font-size="17" fill="#4CC38A">Fixed or FTA: target at a level (range)</text><text x="560" y="190" font-family="Arial" font-size="16" fill="#5AA9E6">FTA: next opposing swing</text><text x="560" y="112" font-family="Arial" font-size="16" fill="#4CC38A">fixed target</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">Our tests used only a fixed bracket (1.5 R): a lower bound</text></svg>