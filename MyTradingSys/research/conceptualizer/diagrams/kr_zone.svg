<svg xmlns="http://www.w3.org/2000/svg" aria-label="A zone spans the wick extreme to the close of a pivot candle; only a close beyond it is a break" width="880" height="400" viewBox="0 0 880 400"><rect x="0" y="0" width="880" height="400" rx="12" fill="#141B24"/><rect x="300" y="150" width="530" height="50" fill="#5AA9E6" opacity="0.22"/><line x1="300" y1="150" x2="830" y2="150" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><line x1="300" y1="200" x2="830" y2="200" stroke="#5AA9E6" stroke-width="3" stroke-dasharray="10 8"/><polyline points="60,320 130,260 200,300 270,180 330,110 400,190 470,150 530,198 600,120 680,80 760,60" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="330" y1="110" x2="330" y2="150" stroke="#F2A23A" stroke-width="3"/><circle cx="330" cy="110" r="8" fill="#F2A23A"/><circle cx="470" cy="150" r="8" fill="#E5534B"/><circle cx="680" cy="80" r="12" fill="#4CC38A"/><text x="24" y="100" font-family="Arial" font-size="17" fill="#F2A23A">wick extreme</text><text x="560" y="235" font-family="Arial" font-size="18" fill="#5AA9E6">zone: wick to close</text><text x="440" y="135" font-family="Arial" font-size="16" fill="#E5534B">poke, snaps back</text><text x="560" y="54" font-family="Arial" font-size="18" fill="#4CC38A">close beyond = break</text><text x="24" y="380" font-family="Arial" font-size="17" fill="#C9D1D9">A close, not a wick, is the verdict</text></svg>