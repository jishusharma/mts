<svg xmlns="http://www.w3.org/2000/svg" aria-label="Signal strength falls as bars between the two points grow; 3 to 10 sourced, 12 and 18 are our own marks" width="880" height="600" viewBox="0 0 880 600"><rect x="0" y="0" width="880" height="600" rx="12" fill="#141B24"/><rect x="125" y="40" width="107" height="500" fill="#5AA9E6" opacity="0.16"/><line x1="80" y1="540" x2="850" y2="540" stroke="#A3B1BF" stroke-width="2"/><line x1="80" y1="40" x2="80" y2="540" stroke="#A3B1BF" stroke-width="2"/><path d="M 125 80 C 200 95, 240 140, 308 220 S 460 400, 536 450 S 760 515, 840 522" fill="none" stroke="#E8EDF2" stroke-width="6"/><line x1="308" y1="40" x2="308" y2="540" stroke="#A3B1BF" stroke-width="2" stroke-dasharray="4 8"/><line x1="262" y1="40" x2="262" y2="540" stroke="#F2A23A" stroke-width="3" stroke-dasharray="12 8"/><line x1="354" y1="40" x2="354" y2="540" stroke="#F2A23A" stroke-width="3" stroke-dasharray="12 8"/><text x="132" y="74" font-family="Arial" font-size="24" font-weight="700" fill="#8CC8F5">3–10</text><text x="370" y="110" font-family="Arial" font-size="24" fill="#F5B86A">12 / 18 = OURS</text><text x="318" y="300" font-family="Arial" font-size="22" fill="#A3B1BF">“under 15”</text><text x="560" y="420" font-family="Arial" font-size="24" fill="#A3B1BF">15–40: “diluted”</text><text x="116" y="575" font-family="Arial" font-size="22" fill="#A3B1BF">3</text><text x="222" y="575" font-family="Arial" font-size="22" fill="#A3B1BF">10</text><text x="296" y="575" font-family="Arial" font-size="22" fill="#A3B1BF">15</text><text x="525" y="575" font-family="Arial" font-size="22" fill="#A3B1BF">30</text><text x="820" y="575" font-family="Arial" font-size="22" fill="#A3B1BF">50</text><text x="96" y="30" font-family="Arial" font-size="22" fill="#A3B1BF">strength (his words, no number)</text></svg>
