<svg xmlns="http://www.w3.org/2000/svg" aria-label="Price closes make a lower low from A to B while RSI makes a higher low; A to B spans 3 to 10 bars" width="880" height="600" viewBox="0 0 880 600"><rect x="0" y="0" width="880" height="300" rx="12" fill="#141B24"/><rect x="0" y="320" width="880" height="280" rx="12" fill="#141B24"/><polyline points="60,80 140,150 220,230 300,250 380,170 460,200 540,260 600,280 680,190 760,120 840,90" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="300" y1="250" x2="600" y2="280" stroke="#F2A23A" stroke-width="4" stroke-dasharray="12 8"/><circle cx="300" cy="250" r="12" fill="#F2A23A"/><circle cx="600" cy="280" r="12" fill="#F2A23A"/><text x="270" y="290" font-family="Arial" font-size="26" font-weight="700" fill="#F5B86A">A</text><text x="620" y="290" font-family="Arial" font-size="26" font-weight="700" fill="#F5B86A">B</text><text x="24" y="40" font-family="Arial" font-size="24" fill="#A3B1BF">price CLOSES: lower low</text><polyline points="60,380 140,430 220,500 300,540 380,470 460,480 540,510 600,515 680,450 760,400 840,380" fill="none" stroke="#E8EDF2" stroke-width="5" stroke-linejoin="round"/><line x1="300" y1="540" x2="600" y2="515" stroke="#5AA9E6" stroke-width="4" stroke-dasharray="12 8"/><circle cx="300" cy="540" r="12" fill="#5AA9E6"/><circle cx="600" cy="515" r="12" fill="#5AA9E6"/><text x="24" y="360" font-family="Arial" font-size="24" fill="#A3B1BF">RSI: higher low</text><path d="M 300 575 L 300 590 L 600 590 L 600 575" fill="none" stroke="#8CC8F5" stroke-width="3"/><text x="660" y="585" font-family="Arial" font-size="24" fill="#8CC8F5">3–10 bars</text></svg>
