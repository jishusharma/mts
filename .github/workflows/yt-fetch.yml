name: yt-fetch

# YouTube freedom route (g): a one-shot, manually dispatched run on GitHub's own address (scripts/dev/yt.py gha route).
# workflow_dispatch only: no schedule, no push or PR trigger (SCHEDULING_POLICY: nothing recurring). Public captions only.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma-separated YouTube video ids"
        required: true
      langs:
        description: "preferred caption languages, first wins"
        required: false
        default: "en,hi"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fetch libraries
        run: pip install yt-dlp youtube-transcript-api certifi
      - name: Fetch captions
        env:
          YT_IDS: ${{ inputs.ids }}
          YT_LANGS: ${{ inputs.langs }}
        run: python scripts/dev/yt_gha_runner.py --ids "$YT_IDS" --langs "$YT_LANGS" --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-fetch
          path: out
          retention-days: 3
