name: CI

# Runs the offline gate (scripts/dev/run_all_tests.py: Python suites + Maven) on every push and PR.
# Nothing here talks to an exchange or reads secrets; tests needing local data skip themselves.
on:
  push:
    branches: [fast-track]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: offline gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # windows mirrors the live box (JIS-NB)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # Runtime folders the user guide points at; gitignored, so a fresh checkout lacks them.
      - name: Create runtime folders
        run: mkdir -p MyTradingSys/execution/plans MyTradingSys/execution/journal MyTradingSys/execution/halt_history

      - name: Offline gate
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/dev/run_all_tests.py
