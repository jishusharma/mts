name: CI

# Runs the offline gate (scripts/dev/run_all_tests.py: Python suites + Maven) on every push and PR.
# Nothing here talks to an exchange or reads secrets; tests needing local data skip themselves.
on:
  push:
    branches: [fast-track]
    paths:
      - 'src/**'
      - 'MyTradingSys/backtest/**'
      - 'MyTradingSys/execution/**'
      - 'MyTradingSys/runtime/**'
      - 'MyTradingSys/tests/**'
      - 'MyTradingSys/items/**'
      - 'MyTradingSys/research/**/*.py'   # GATE_SPEED review: smoke ships under these folders defer tests to CI, so CI must run for them
      - 'MyTradingSys/options/**'
      - 'MyTradingSys/observation/**'
      - '.gitignore'
      - '.claude/settings.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/fast-track' && github.sha || 'run' }}
  # fast-track gets a merge every few minutes and a run takes ~6 min: cancelling the running push job starved mark-green.
  # Operator 2026-10-22 (q-ci-speed-fixes): one group PER COMMIT on fast-track, so a push starts at once instead of queueing up
  # to 15 min behind the running one; mark-green below never moves green backwards. PR and other-ref runs are still superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/fast-track' }}

jobs:
  offline-gate:
    name: offline gate (${{ matrix.os }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # windows mirrors the live box (JIS-NB). Its leg took 14 of 15 min (run 0cf9fdf4): split in 3 parallel shards
        # (run_all_tests.py --shard); every shard must pass before mark-green. Linux (3 min) stays whole.
        include:
          - {os: ubuntu-latest, shard: "1/1"}
          - {os: windows-latest, shard: "1/3"}
          - {os: windows-latest, shard: "2/3"}
          - {os: windows-latest, shard: "3/3"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests that commit in temp repos need an identity; a fresh runner has none.
      - name: Git identity
        run: git config --global user.name ci && git config --global user.email ci@users.noreply.github.com

      - name: Install pytest
        run: python -m pip install pytest numpy pandas tzdata

      # Runtime folders the user guide points at; gitignored, so a fresh checkout lacks them.
      - name: Create runtime folders
        run: mkdir -p MyTradingSys/execution/plans MyTradingSys/execution/journal MyTradingSys/execution/halt_history

      # Windows runners keep TEMP on the slow C: drive; the checkout is on D:. pytest temp dirs go to D: (runner.temp).
      # The runner is a throwaway VM: real-time Defender scanning is switched off there to cut file-heavy test time.
      - name: Fast disk for temp files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV

      - name: Offline gate
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/dev/run_all_tests.py --shard ${{ matrix.shard }}

  # Operator 2026-10-07: a PR into fast-track merges itself once the gate is green on both OSes.
  # Opt out with the "no-automerge" label or by keeping the PR a draft. Merging here does not deploy:
  # JIS-NB still pulls by hand (stop, merge, test, restart). Fork PRs never get a write token, so they never merge.
  auto-merge:
    needs: offline-gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'fast-track' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested head into fast-track
        env:
          GH_TOKEN: ${{ github.token }}
        # --match-head-commit: refuse if a newer, untested commit landed on the PR meanwhile
        run: >-
          gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
          --merge --match-head-commit ${{ github.event.pull_request.head.sha }}

  # CD, safe half: the last SHA whose gate was green on both OSes is published as the branch green/fast-track.
  # The supervisor deploy to the live tree (JIS-NB) is `git merge --ff-only origin/green/fast-track` + restart, so a
  # half-tested push can never be deployed. This job restarts nothing and touches no exchange or secret.
  mark-green:
    needs: offline-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fast-track'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs are per commit now, so an older commit can finish after a newer one: publish only when the current green is an
    # ancestor of this SHA (green never moves backwards), one mark-green at a time, with a lease on the green we checked.
    concurrency:
      group: mark-green
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tested SHA as green/fast-track
        run: |
          old=$(git ls-remote origin refs/heads/green/fast-track | cut -f1)
          if [ -n "$old" ] && ! git merge-base --is-ancestor "$old" "${{ github.sha }}"; then
            echo "green/fast-track is at $old, newer than or beside ${{ github.sha }}: left as is"; exit 0
          fi
          git push --force-with-lease="refs/heads/green/fast-track:$old" origin "${{ github.sha }}:refs/heads/green/fast-track"
